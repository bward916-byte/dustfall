<style>

</style>
</head>

function pnote(m,t,d,v){

function updAudio(){
  const s=G.b[1],open=s.level>0&&!s.building&&G.state==='play';
  pianoVol=open?clamp(1-Math.abs(s.x+43-G.player.x)/280,0,1):0;
  if(!AC)return;
  pianoBus.gain.setTargetAtTime(muted?0:pianoVol*.4,AC.currentTime,.2);
  const gust=.5+.5*Math.sin(G.clock*.31)*Math.sin(G.clock*.13),alive=G.b.filter(b=>b.level).length;
  windBus.gain.setTargetAtTime(muted?0:Math.max(.008,.036-alive*.006)*(.4+gust),AC.currentTime,.3);
  if(nextNote<AC.currentTime)nextNote=AC.currentTime+.05;
  while(nextNote<AC.currentTime+.25){
    if(pianoVol>.02&&!muted){
      const i=noteIdx,st=i%8,root=48+PROG[Math.floor(i/8)%8];
      if(st===0)pnote(root-12,nextNote,.3,.5);
      if(st===4)pnote(root-5,nextNote,.3,.45);
      if(st===2||st===6){pnote(root+4,nextNote,.14,.25);pnote(root+7,nextNote,.14,.25);}
      if(hash(i*1.7)>.18)pnote(root+12+RH[i%16],nextNote,.16,.4);
    }
    noteIdx++;nextNote+=.19;
  }
  if(G.state==='play'&&G.dark>.6&&!G.wx&&BIO!=='snow'){

    if(t>nextChirp){nextChirp=t+.5+Math.random()*.6;const f=3900+Math.random()*500,v=.011+Math.random()*.008;for(let i=0;i<3;i++)tone1(f,.028,'sine',v,0,i*.055);}

// ---------- time of day
function darkness(t){
  if(t<.06)return .5*(1-t/.06);
  if(t<.58)return 0;
  if(t<.70)return (t-.58)/.12;
  if(t<.94)return 1;
  return 1-.5*(t-.94)/.06;
}
const warmth=t=>Math.max(0,1-Math.abs(t-.61)/.09,1-Math.min(Math.abs(t-1),t)/.05);
const SKY=[[0,'#5b6494','#f2b27c'],[.08,'#6fb0d4','#f3e0b5'],[.5,'#6fb0d4','#f3e0b5'],[.6,'#5a4a86','#f6a35a'],[.66,'#3a2a5c','#e8703f'],
  [.73,'#0b0d24','#2b2350'],[.93,'#0b0d24','#2b2350'],[1.001,'#5b6494','#f2b27c']].map(k=>[k[0],rgb(k[1]),rgb(k[2])]);
function skyAt(t){
  let i=0;while(SKY[i+1][0]<=t)i++;
  const a=SKY[i],b=SKY[i+1],k=(t-a[0])/(b[0]-a[0]);
  return [mixA(a[1],b[1],k),mixA(a[2],b[2],k)];
}

function updRider(dt,fresh,shoes,d){

  if(fresh){

    if(Math.random()<dt*9)G.parts.push({x:p.x-p.dir*rnd(6,16),h:rnd(4,16),vx:-p.dir*rnd(20,40),vh:0,life:0,max:.35,col:'#fff6dc',grav:0,streak:1});
  }else if(slow){
    p.wind=Math.min(1,p.wind+dt*(atT?1.5:rainy()?.5:d?.1:.2));
    if(atT&&p.wind<1&&Math.random()<dt*14)G.parts.push({x:p.x+p.dir*9+rnd(-2,2),h:5,vx:rnd(-8,8),vh:rnd(8,18),life:0,max:.4,col:'#9fd0e8',grav:-60});
  }
  if(p.blown&&p.wind>.35)p.blown=false;
  // the six-shooter: it picks the nearest raider in reach; riding past the open store fills it again
  p.gcd-=dt;p.gun-=dt;
  const rng=118*sightK();let tg=null,bd=rng;
  for(const q of hostiles()){const dd=Math.abs(q.x-p.x);if(dd<bd){bd=dd;tg=q;}}
  p.sight=tg;
  if(tg&&p.ammo>0)hint('gun',false,document.body.classList.contains('touch')?'Raiders in range. Tap the gun button to fire your six-shooter. Six shots, and riding past the store reloads you.':'Raiders in range. Press F to fire your six-shooter. Six shots, and riding past the store reloads you.');
  const fire=input.fireKey||input.fireTouch||input.padFire||input.fireTap;input.fireTap=false;if(!fire)p.glock=false;   // a tap shorter than a frame still counts
  if(fire&&!p.glock&&p.gcd<=0){
    p.glock=true;

    else{
      const dir=tg?Math.sign(tg.x-p.x)||p.dir:p.dir,hit=!!tg&&Math.random()<.82;
      p.ammo--;p.gcd=.38;p.gun=.16;p.gdir=dir;sfx.shot(1);G.shake=Math.max(G.shake,.07);

      if(hit){tg.hp-=2;tg.hurt=.18;dust(tg.x,8,3,'#d04a3a');if(tg.hp<=0){if(tg===G.outlaw)killOutlaw();else killBandit(tg);}}

  if(G.town&&!cl.level&&Math.abs(p.x-cl.x-15)<45)hint('claim0',false,`An abandoned claim. Stake it for ${costOf(cl)} coins and a prospector will work it for you.`);

function updCoach(dt){

        const r=c.rob[i];c.fl=.08;r.hurt=.18;sfx.shot(near(c.x));G.shots.push({x0:c.x+18,x1:c.x+r.dx,h:29,h1:9,hit:1});

      if(c.t>2.5){c.st='out';c.done=true;c.rob=null;G.owed=(G.owed||0)+coachPay();hint('coachsafe',true,`The guard saw off a hold-up at the rock arch. The stage line pays you ${coachPay()} coins at dawn.`);}

    }

function slotPos(b,i,n){

}
const live=b=>b.type==='train'?!!G.train&&!G.train.v&&!G.trip:b.type==='coach'?!!G.coach&&G.coach.st==='stop':true;
const zoneOf=x=>{const c=G.b[18],hit=b=>x>b.x-6&&x<b.x+b.w+12;return live(c)&&hit(c)?c:G.b.find(b=>live(b)&&hit(b));};

function target(x){

  const b=zoneOf(x);if(!b||b.building)return null;

}
function tossCoin(tg,fromBank){

function updPlayer(dt){

function step(o,tx,speed,dt){

function banditAct(q,dt,p){
  q.atGate=false;
  // barbed wire on their side slows them to a crawl and throws riders, who carry on on foot
  const wr=G.b[q.side<0?11:12],snag=q.state==='raid'&&wr.level&&q.x>wr.x-2&&q.x<wr.x+wr.w+2;
  if(snag&&q.kind==='rider'){q.kind='bandit';dust(q.x,6,12);sfx.crash(near(q.x)*.5);hint('thrown');}
  if(snag&&!q.cut){q.cut=1;if(wr.level>1){q.hp-=wr.level-1;q.hurt=.18;dust(q.x,6,4,'#d04a3a');if(q.hp<=0){killBandit(q);return;}}}   // the second apron cuts whoever crosses it

    step(q,q.side<0?-40:WORLD+40,sp+6,dt);
    if(q.x<-20||q.x>WORLD+20)G.bandits.splice(G.bandits.indexOf(q),1);
    return;
  }
  if(q.kind==='boss'&&(q.cd2-=dt)<=0){
    // the outlaw shoots back, and a hit costs a deputy his badge
    const t=G.folk.filter(f=>f.role==='deputy'&&!f.sick&&Math.abs(f.x-q.x)<150).sort((a,z)=>Math.abs(a.x-q.x)-Math.abs(z.x-q.x))[0];
    if(t){
      q.cd2=2.4;G.shots.push({x0:q.x+Math.sign(t.x-q.x)*6,x1:t.x,h:10,hit:1,col:'#ff9a6a'});sfx.shot(near(q.x));
      if(Math.random()<.3){t.aim=false;dust(t.x,8,5,'#d04a3a');if(G.b[13].level){t.sick=true;hint('patched',true);}else{t.role='folk';t.goal='';hint('wounded',true);}}
    }
  }
  // a standing gate on their side has to be broken down first, unless you are out there with them
  const dp=p.x-q.x,g=G.b[q.side<0?6:7];
  if(g.level&&g.hp>0&&(q.side<0?q.x>g.x-9&&q.x<=g.x+2:q.x<g.x+g.w+9&&q.x>=g.x+g.w-2)&&!(Math.abs(dp)<75&&(p.x-g.x)*q.side>0)){
    q.moving=false;q.dir=-q.side;q.atGate=true;
    if(q.cd<=0){q.cd=1.3;g.hp-=K[2];g.shake=.2;sfx.hammer(near(g.x));dust(g.x+7,8,3,'#b89a66');for(let i=0;i<2;i++)G.parts.push({x:g.x+7,h:rnd(6,14),vx:q.side*rnd(10,40),vh:rnd(20,50),life:0,max:.8,col:'#a8875c',grav:-170,conf:1});if(g.hp<=0)breakGate(g);}
    return;
  }
  let c=null,bd=55;
  if(q.kind!=='boss')for(const k of G.coins)if(k.st==='ground'&&!k.claimed&&Math.abs(k.x-q.x)<bd){bd=Math.abs(k.x-q.x);c=k;}
  if(c){if(step(q,c.x,sp,dt)){G.coins.splice(G.coins.indexOf(c),1);q.loot++;q.state='flee';}return;}
  if(Math.abs(dp)<75){
    step(q,p.x,sp,dt);
    if(Math.abs(dp)<9&&q.cd<=0){
      q.cd=1.6;G.shake=.3;G.flash=.3;sfx.hit();p.rear=.6;sfx.whinny();
      if(p.coins<=0&&G.bank<=0){gameOver();return;}
      if(p.coins<=0){const n=Math.min(5,G.bank);G.bank-=n;q.loot+=n;q.state='flee';hint('paidoff',true);return;}
      const n=Math.min(K[3],p.coins);p.coins-=n;
      for(let i=0;i<n;i++)coin(p.x,14,rnd(-50,50),rnd(60,90),false);
      hint('hit');
    }
    return;
  }
  const cw=q.rustle&&G.herd.find(k=>Math.abs(k.x-q.x)<80);
  if(cw){
    if(step(q,cw.x,sp,dt)){G.herd.splice(G.herd.indexOf(cw),1);q.loot+=2;q.state='flee';sfx.moo(near(q.x));dust(q.x,4,6);hint('rustle',true);}
    return;
  }
  let f=null;bd=60;
  for(const k of G.folk)if(k.role!=='deputy'&&!k.hidden&&!k.sick&&Math.abs(k.x-q.x)<bd){bd=Math.abs(k.x-q.x);f=k;}
  if(f){
    if(step(q,f.x,sp,dt)){
      if(G.b[13].level){f.sick=true;f.goal='';hint('patched',true);}
      else{G.folk.splice(G.folk.indexOf(f),1);drifter(nearCamp(f.x),false,f.x);hint('mug');}

    if(step(q,bank.x+32,sp,dt)){const n=Math.min(G.bank,10);G.bank-=n;q.loot+=n;bank.robbed=true;q.state='flee';sfx.box();dust(q.x,6,8);hint('bankrob',true);}

  if(step(q,q.tx,sp-10,dt))q.tx=rnd(TOWN[0],TOWN[1]);
}

    if(Math.abs(c.tx-c.x)>1){c.dir=Math.sign(c.tx-c.x);c.x+=c.dir*6*dt;}
  }
}

  }
  for(const x of [...(G.b[9].level?[]:[FIRE_X]),...G.camps.map(c=>c.x),...(G.dark>.3?[G.b[6],G.b[7]].filter(g=>g.level).map(g=>g.x+7-g.side*16):[])]){
    if(Math.random()<dt*2.5)G.parts.push({x:x+rnd(-1,1),h:6,vx:rnd(-4,4),vh:rnd(10,20),life:0,max:rnd(.6,1.3),col:Math.random()<.5?'#ffb13b':'#ff7a2a',grav:0,lit:1});

  }
  if(Math.random()<dt*6)G.parts.push({x:G.cam+rnd(-20,W),h:rnd(1,GY*.5),vx:rnd(30,60),vh:rnd(-2,3),life:0,max:rnd(.8,1.8),col:DUSTC,grav:0,streak:1});

  for(let i=G.shots.length-1;i>=0;i--){
    const b=G.shots[i];
    if(b.d===undefined){
      b.h1=b.h1||b.h;b.t=0;b.d=Math.max(.06,Math.hypot(b.x1-b.x0,b.h1-b.h)/520);

  for(let i=G.prints.length-1;i>=0;i--)if((G.prints[i].t+=dt)>9)G.prints.splice(i,1);

  // now and then a shooting star
  if(G.dark>.9&&!G.meteor&&Math.random()<dt*.05)G.meteor={x:rnd(.05,.8),y:rnd(.04,.4),t:0};
  if(G.meteor&&(G.meteor.t+=dt)>.7)G.meteor=null;

}
function update(dt){
  G.clock+=dt;
  if(G.state==='intro')updIntro(dt);
  else if(G.state==='play'){
    if(G.trip)updTrain(dt);
    else{
      G.t+=dt/DAY_LEN;
      if(G.t>=1){G.t-=1;G.day++;dawn();}
      if(G.t>.58&&!G.duskDone)dusk();
      G.raid=G.raid.filter(r=>G.t<r.t||(spawnBandit(r.side,r.kind,r.hp),false));
      G.dark=darkness(G.t);
      updPlayer(dt);updCoins(dt);updDrifters(dt);updFolk(dt);updBandits(dt);
      if(G.state==='play'){updBuild(dt);updTrain(dt);updHens(dt);updDog(dt);updHerd(dt);updGuns(dt);updNests(dt);updCoach(dt);updOutlaw(dt);}
      const p=G.player;let goal=p.x+p.dir*W*.1-W/2;
      if(G.focus&&G.train&&G.state==='play')goal=clamp(G.train.x+50-W/2,p.x-W+28,p.x-28);   // never so far that you leave the frame
      G.cam+=(clamp(goal,0,WORLD-W)-G.cam)*Math.min(1,dt*(G.focus?1.6:3.5));
    }
  }else{G.dark=darkness(G.t);if(G.state==='title')G.cam=clamp(FIRE_X-35-W/2,0,WORLD-W);}
  updWorld(dt);
}

    if(G.meteor){const m=G.meteor,mx=m.x*W+m.t*80,my=m.y*GY+m.t*34;for(let k=0;k<8;k++){ctx.globalAlpha=(1-m.t/.7)*(1-k/8);P(mx-k*2,my-k*.85,k<2?'#fff':'#cfd6ff');}ctx.globalAlpha=1;}
  }
  if(BIO==='snow'&&dark>.6&&!G.wx){
    for(let x=0;x<W;x+=2){
      const u=x*.028+G.clock*.05,top=Math.round(GY*(.14+.06*(Math.sin(u)+Math.sin(u*2.3+1.7)*.5))),hh=GY*(.2+.07*Math.sin(u*1.7+G.clock*.11)),a=(dark-.6)*2.5*(.45+.55*Math.sin(u*3.1+G.clock*.21)**2)*.3;
      for(let k=0;k<4;k++){ctx.globalAlpha=a*(1-k*.24);R(x,top+Math.round(hh*k/4),2,Math.ceil(hh/4),k<2?'#6affc0':k<3?'#5ad8e8':'#8a8cf0');}
    }
    ctx.globalAlpha=1;
  }
  const sa=clamp((dark-.35)/.5,0,1);
  // the Milky Way: a dim band of small stars across the sky
  if(sa>0)for(let i=0;i<90;i++){const u=hash(i+500),x=Math.floor(u*W),y=Math.floor(GY*(.62-u*.5)+(hash(i+530)-.5)*GY*.16);if(y>0&&y<GY-22){ctx.globalAlpha=sa*(.2+hash(i+560)*.3);P(x,y,i%3?'#9aa4d8':'#d6dcff');}}
  if(sa>0)for(let i=0;i<70;i++){
    const x=Math.floor(hash(i+70)*W),y=Math.floor(hash(i+90)*(GY-20));ctx.globalAlpha=sa*(.45+.55*Math.sin(G.clock*(1+hash(i)*2)+i*1.7)**2);
    P(x,y,i%7?'#fff':'#ffe9b0');if(i%11===0){P(x-1,y,'#cfd6ff');P(x+1,y,'#cfd6ff');P(x,y-1,'#cfd6ff');P(x,y+1,'#cfd6ff');}
  }
  ctx.globalAlpha=1;
  for(let y=0;y<GY;y++)R(0,y,W,1,css(mixA(st,sb,Math.pow(y/(GY-1),1.3))));     // one shade per row, so the sky is smooth
  R(0,GY,W,H-GY,css(sb));
  ctx.globalCompositeOperation='source-over';
}

// ---------- canvas sizing: whole-number pixel scale; portrait gets a tall sky and leaves room below for the controls
function resize(){
  const dpr=window.devicePixelRatio||1,sw=stage.clientWidth,sh=stage.clientHeight,tall=sw/sh<1.25;
  const ch=tall?Math.min(sh,clamp(sh-210,sw/1.25,sw*1.5)):sh;
  const sc=tall?Math.max(1,Math.round(sw*dpr/200)):Math.max(1,Math.round(ch*dpr/170),Math.ceil(sw*dpr/480));
  W=Math.ceil(sw*dpr/sc);H=Math.ceil(ch*dpr/sc);GY=H-clamp(Math.round(H*.26),30,48);
  cv.width=ppl.width=W;cv.height=ppl.height=H;cv.style.width=W*sc/dpr+'px';cv.style.height=$('cine').style.height=H*sc/dpr+'px';
  ctx.imageSmoothingEnabled=false;
}
reset();addEventListener('resize',resize);resize();
window.dustfall={todo,maxed,showMap,hideMap,costOf,target,rackX,nextTown,dawn,dusk,postBounty,layout};   // for the test scripts

// ---------- input
const KEYS={ArrowLeft:-1,a:-1,A:-1,ArrowRight:1,d:1,D:1},FIREKEYS=['f','F','x','X','Enter','ArrowUp','w','W'];
const held=new Set();
addEventListener('keydown',e=>{
  if(G.state==='intro'){e.preventDefault();if(G.intro.t>.6)endIntro(true);return;}
  if(G.state!=='play'){if(e.key==='Enter'||e.key===' '){e.preventDefault();start();}return;}
  if(!$('map').hidden){if(!mapBusy)hideMap();e.preventDefault();return;}
  if(e.key==='m'||e.key==='M'){if(!G.trip)showMap();return;}
  if(KEYS[e.key]){held.add(e.key);input.key=KEYS[e.key];e.preventDefault();}
  if(e.key===' '||e.key==='ArrowDown'||e.key==='s'||e.key==='S'){input.dropKey=true;e.preventDefault();}
  if(FIREKEYS.includes(e.key)){input.fireKey=true;e.preventDefault();}
});
addEventListener('keyup',e=>{
  if(KEYS[e.key]){held.delete(e.key);const last=[...held].pop();input.key=last?KEYS[last]:0;}
  if(e.key===' '||e.key==='ArrowDown'||e.key==='s'||e.key==='S')input.dropKey=false;
  if(FIREKEYS.includes(e.key))input.fireKey=false;
});
addEventListener('blur',()=>{held.clear();input.key=0;input.dropKey=input.fireKey=false;});
const pad=$('pad'),knob=$('knob'),toss=$('toss');let padId=null;
const padSet=e=>{const r=pad.getBoundingClientRect(),dx=clamp(e.clientX-r.left-r.width/2,-34,34);input.stick=dx/34;knob.style.transform=`translateX(${dx}px)`;};
pad.addEventListener('pointerdown',e=>{padId=e.pointerId;try{pad.setPointerCapture(padId);}catch(_){}padSet(e);e.preventDefault();});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)padSet(e);});
for(const ev of ['pointerup','pointercancel'])pad.addEventListener(ev,e=>{if(e.pointerId===padId){padId=null;input.stick=0;knob.style.transform='';}});
toss.addEventListener('pointerdown',e=>{input.dropTouch=true;toss.classList.add('on');e.preventDefault();});
for(const ev of ['pointerup','pointercancel','pointerleave'])toss.addEventListener(ev,()=>{input.dropTouch=false;toss.classList.remove('on');});
const fireB=$('fire');
fireB.addEventListener('pointerdown',e=>{input.fireTouch=input.fireTap=true;fireB.classList.add('on');e.preventDefault();});
for(const ev of ['pointerup','pointercancel','pointerleave'])fireB.addEventListener(ev,()=>{input.fireTouch=false;fireB.classList.remove('on');});addEventListener('contextmenu',e=>e.preventDefault());
const touchy=()=>{document.body.classList.add('touch');if(G.state==='title')$('how').textContent='Push the stick to ride, further to gallop. Tap the coin to toss one, the gun to fire.';};
if((window.matchMedia&&matchMedia('(pointer:coarse)').matches)||navigator.maxTouchPoints>0)touchy();
addEventListener('touchstart',touchy,{once:true,passive:true});
// stop long-press text selection, the copy bubble, and double-tap or pinch zoom; real buttons still get their taps
const quiet=e=>{const t=e.target.closest?e.target:e.target.parentElement;if(!t||!t.closest('#go,#cont,#mute,#mapb,#map'))e.preventDefault();};
for(const ev of ['touchstart','touchmove','touchend','gesturestart','selectstart','dblclick'])document.addEventListener(ev,quiet,{passive:false});
// physical controller: left stick or d-pad rides, A / X or right trigger tosses, B / Y or right bumper fires, A or Start begins
let padWas=false;
function pollPad(){
  const gp=navigator.getGamepads?[...navigator.getGamepads()].find(g=>g&&g.connected):null,on=i=>!!(gp&&gp.buttons[i]&&gp.buttons[i].pressed);
  input.padAxis=gp&&Math.abs(gp.axes[0])>.25?gp.axes[0]:0;input.dpad=on(15)-on(14);input.padDrop=[0,2,7].some(on);input.padFire=[1,3,5].some(on);
  const go=on(0)||on(9);if(go&&!padWas){if(G.state==='intro')endIntro(true);else if(G.state!=='play')start();}padWas=go;
}
addEventListener('gamepadconnected',()=>{if(G.state==='title')$('how').textContent='Controller: stick or d-pad to ride, A to toss a coin, B to fire.';});
$('mapb').addEventListener('click',()=>{$('mapb').blur();if(G.state==='play'&&!G.trip)showMap();});
$('map').addEventListener('click',()=>{if(!mapBusy)hideMap();});
$('mute').addEventListener('click',()=>{muted=!muted;$('mute').textContent=muted?'Sound off':'Sound on';$('mute').classList.toggle('off',muted);$('mute').blur();});

// ---------- start and loop
function start(keep){
  if(G.state==='play'||G.state==='intro')return;
  const fresh=G.state==='title'&&keep!==true&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
  document.body.classList.remove('over');if(G.state==='over')reset();
  initAudio();if(AC&&AC.state==='suspended')AC.resume();
  if(fresh)return beginIntro();
  if(keep!==true){G.t=.08;hint('start');}
  G.state='play';G.player.lock=true;input.key=input.stick=0;input.dropKey=input.dropTouch=input.fireKey=input.fireTouch=false;held.clear();
  $('title').hidden=true;document.body.classList.remove('title');
}
$('go').addEventListener('click',start);
document.addEventListener('pointerdown',()=>{if(G.state==='intro'&&G.intro.t>.6)endIntro(true);});
$('cont').addEventListener('click',()=>{if(load())start(true);});
if(peek()){$('cont').hidden=false;$('cont').textContent='Continue in '+nice(TOWNS[(peek().town||0)%6])+', day '+peek().day;}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});addEventListener('pagehide',save);
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  pollPad();if(!paused)for(let i=0;i<G.timeScale;i++)update(dt);
  draw();hud();updAudio();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();

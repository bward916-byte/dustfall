<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#24160f">
<title>Dustfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
<style>
:root{--ink:#24160f;--cream:#f0dfb4;--gold:#f2c14e;--rust:#a8452e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;touch-action:none}
body{background:var(--ink);color:var(--cream);font-family:Rye,Rockwell,Georgia,serif;overflow:hidden;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#stage{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
canvas{display:block;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none}
#hud{position:absolute;top:10px;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;font-size:20px;text-shadow:0 2px 0 rgba(36,22,15,.85);pointer-events:none}
#purse{display:flex;align-items:center;gap:8px}
#vault{display:flex;align-items:center;gap:7px;font-size:17px}
#vault[hidden]{display:none}
.safe{display:inline-block;width:18px;height:16px;border:2px solid var(--cream);border-radius:3px;background:radial-gradient(circle,var(--gold) 0 3px,rgba(36,22,15,.7) 3.5px);box-shadow:0 2px 0 rgba(36,22,15,.7)}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff3b8 0 11%,transparent 12%),radial-gradient(circle,#f2c14e 0 44%,#c9922a 45% 58%,#f2c14e 59%);box-shadow:inset -2px -2px 0 #c08a1e,0 0 0 1.5px #a8741a,0 3px 0 1px rgba(36,22,15,.7)}
#coins,#bankc{display:inline-block}
.bump{animation:bump .28s}
@keyframes bump{40%{transform:scale(1.4);color:#fff}}
@media (prefers-reduced-motion:reduce){.bump{animation:none}}
#day{margin-left:auto}
#mute{pointer-events:auto;font:inherit;font-size:15px;color:var(--cream);background:rgba(36,22,15,.5);border:1px solid rgba(240,223,180,.5);border-radius:4px;padding:4px 10px;cursor:pointer}
#hint{position:absolute;left:50%;top:50px;transform:translateX(-50%);width:max-content;max-width:min(92%,34rem);text-align:center;font-family:Georgia,serif;font-size:15px;line-height:1.35;background:rgba(36,22,15,.85);padding:8px 14px;border-radius:4px;opacity:0;transition:opacity .4s;pointer-events:none}
#hint.on{opacity:1}
#pad,#toss{position:absolute;bottom:18px;display:none;touch-action:none;-webkit-tap-highlight-color:transparent}
.touch #pad{display:grid}
.touch #toss{display:grid}
.title #pad,.title #toss,.title #hud{display:none}
#pad{left:max(14px,env(safe-area-inset-left,0px));width:124px;height:124px;border-radius:50%;place-items:center;background:rgba(36,22,15,.4);border:2px solid rgba(240,223,180,.5)}
#pad svg{position:absolute;top:50%;margin-top:-9px;width:18px;height:18px;fill:var(--cream);opacity:.5;pointer-events:none}
#pad svg:first-of-type{left:7px}
#pad svg:last-of-type{right:7px}
#knob{width:54px;height:54px;border-radius:50%;background:rgba(240,223,180,.88);box-shadow:inset -5px -6px 0 rgba(120,90,50,.5),0 3px 0 rgba(36,22,15,.6);pointer-events:none}
#toss{right:max(20px,env(safe-area-inset-right,0px));bottom:34px;width:88px;height:88px;border-radius:50%;place-items:center;padding:0;background:rgba(36,22,15,.45);border:2px solid rgba(242,193,78,.85)}
#toss.on{background:rgba(242,193,78,.3)}
#toss .coin{width:38px;height:38px;box-shadow:inset -4px -4px 0 #c08a1e,0 0 0 3px #a8741a}
#title{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:12px;padding:20px;background:linear-gradient(rgba(36,22,15,.1),rgba(36,22,15,.6))}
#title h1{margin:0;font-weight:400;font-size:clamp(46px,12vw,108px);line-height:1;letter-spacing:.02em;text-shadow:0 4px 0 var(--rust),0 8px 0 var(--ink)}
#title p{margin:0;font-family:Georgia,serif;font-size:17px;text-shadow:0 1px 0 var(--ink),0 0 8px var(--ink)}
#go{font:inherit;font-size:22px;color:var(--ink);background:var(--gold);border:0;border-bottom:4px solid #b9861f;border-radius:4px;padding:10px 28px 8px;margin-top:6px;cursor:pointer}
#cont{font:inherit;font-size:16px;color:var(--cream);background:rgba(36,22,15,.6);border:1px solid rgba(240,223,180,.6);border-radius:4px;padding:8px 20px 6px;cursor:pointer}
#go:focus-visible,#cont:focus-visible,#mute:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
#title[hidden]{display:none}
#cine{position:absolute;top:0;left:0;right:0;height:100%;pointer-events:none;overflow:hidden}
#barT,#barB{position:absolute;left:0;right:0;height:0;background:#0b0705;transition:height .9s ease;display:flex;align-items:center;justify-content:center;overflow:hidden}
#barT{top:0}
#barB{bottom:0}
.cine #barT,.cine #barB{height:14%}
.peek #barT,.peek #barB{height:6%}
#cap{font-family:Georgia,serif;font-style:normal;font-size:clamp(14px,2.5vw,20px);line-height:1.3;text-align:center;padding:0 16px;max-width:38rem;opacity:0;transition:opacity .7s}
#cap.on{opacity:1}
#card{position:absolute;left:0;right:0;top:27%;margin:0;text-align:center;font-weight:400;font-size:clamp(46px,12vw,108px);line-height:1;letter-spacing:.02em;text-shadow:0 4px 0 var(--rust),0 8px 0 var(--ink);opacity:0;transform:scale(.93);transition:opacity 1.1s,transform 3s ease-out}
#card.on{opacity:1;transform:none}
#card small{display:block;font-family:Georgia,serif;font-size:17px;letter-spacing:0;margin-top:16px;text-shadow:0 1px 0 var(--ink),0 0 8px var(--ink)}
#skip{position:absolute;right:14px;top:8px;margin:0;font-family:Georgia,serif;font-size:12px;opacity:0;transition:opacity .6s}
.cine #skip{opacity:.65}
.cine #hud,.cine #pad,.cine #toss,.cine #hint{display:none}
@media (prefers-reduced-motion:reduce){#barT,#barB,#cap,#card{transition:none}}
</style>
</head>
<body class="title">
<div id="stage"><canvas id="game"></canvas></div>
<div id="hud">
  <span id="purse"><i class="coin"></i><b id="coins">8</b></span>
  <span id="vault" aria-label="In the bank" hidden><i class="safe"></i><b id="bankc">0</b></span>
  <span id="day">Day 1</span>
  <button id="mute" type="button">Sound on</button>
</div>
<div id="cine"><i id="barT"></i><i id="barB"><span id="cap"></span></i><h2 id="card"></h2><p id="skip">Tap or press any key to skip</p></div>
<div id="hint" role="status"></div>
<div id="pad" aria-label="Thumbstick: ride left or right">
  <svg viewBox="0 0 24 24"><path d="M16 4 6 12l10 8z"/></svg><i id="knob"></i><svg viewBox="0 0 24 24"><path d="m8 4 10 8-10 8z"/></svg>
</div>
<button id="toss" type="button" aria-label="Toss a coin"><i class="coin"></i></button>
<div id="title">
  <h1>Dustfall</h1>
  <p id="tag">A dead town, a tired horse, and a purse of coins.</p>
  <button id="go" type="button">Ride in</button>
  <button id="cont" type="button" hidden>Continue</button>
  <p id="how">Arrow keys or A and D to ride. Space to toss a coin.</p>
</div>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);

}

const tone=(h,f)=>{f=Math.round(f*20)/20;return toneC[h+f]||(toneC[h+f]=css(rgb(h).map(v=>clamp(v*f,0,255))));};

// ---------- buildings: cost per level, morning payout, and the look of each front

    door:{x:49,w:13,h:20},wins:[{x:6,y:-21,w:35,h:14,big:1}],posts:[-4,70]},

    door:{x:26,w:24,h:22,barn:1},wins:[{x:8,y:-19,w:10,h:9},{x:58,y:-19,w:10,h:9}],posts:[]},

  bank:{name:'BANK',w:64,h:38,cost:[10,16],pay:0,tier:1,wall:'#b9b2a4',trim:'#3d4a44',roof:'#3d4a44',sign:'#2f3a36',ink:'#e8d9a0',

  bordello:{name:'BORDELLO',w:74,h:38,cost:[9,14,20],pay:5,up:1,tier:1,wall:'#b0506a',trim:'#f0d9c0',roof:'#5a2030',sign:'#f0d9c0',ink:'#8a2040',
    door:{x:30,w:14,h:21},wins:[{x:8,y:-21,w:13,h:12},{x:53,y:-21,w:13,h:12}],posts:[-3,24,50,75]},

const KIND={bandit:[2,40,1,3],rider:[3,74,1,4],boss:[12,30,2,5]};   // hit points, speed, damage to a gate, coins knocked from your purse

const mk=(type,x,side)=>({type,x,w:DEF[type].w,level:0,paid:0,incoming:0,building:false,progress:0,robbed:false,badges:0,hp:0,side:side||0});
const topOf=(b,L)=>{const d=DEF[b.type];return d.hall?[14,40,74][L]:d.h+(d.up&&L>1?22:0)+(d.gate&&L>1?8:0)+(d.gate&&L>2?8:0);};
const tall=(b,L)=>topOf(b,L)+(b.type==='sheriff'&&L>1?34:0)+(L>2?14:0);
function wins(b,L){
  const w=DEF[b.type].wins.slice();
  if(b.type==='saloon'&&L>1)w.push({x:8,y:-51,w:14,h:13},{x:64,y:-51,w:14,h:13},{x:38,y:-43,w:10,h:17,door:1});

  if(b.type==='store'&&L>1)w.push({x:9,y:-52,w:14,h:13},{x:47,y:-52,w:14,h:13});

// ---------- state

// ---------- sprites
function sprite(rows,pal){

  return {r:mkc(false),l:mkc(true),w,h};
}
const PAL={h:'#8b4a2b',l:'#a86039',d:'#6b3820',k:'#2e1a12',e:'#120b08',n:'#5e3220',b:'#d8b25a',c:'#b53a2e',S:'#4a2c1a',

const HROWS=[
'.....................k.k..', '....................khhh..',
'...................kkhlhh.', '..................kkhhhehh',
'.................kkklhhhhh', '................kkklhh.hnn',
'...lllllSSSSllkkklhhh.....', '..lhhhhbbbbbbhhhhhhhh.....',
'.hhhhhhbcccbbhhhhhhh......', '.hhhhhhhhhhhhhhhhhh.......',
'.hhhhhhhhhhhhhhhhh........', '.dhhhhhhhhhhhhhhhd........',
'..ddddddddddddddd.........'],HORSE=sprite(HROWS,PAL),HORSE2=sprite(HROWS,PAL2);
const RROWS=[
'..HHH...', '..HHH...',
'HHTTTHH.', '..sss...',
'..css...', '.vRRv...',
'.vRRvss.', '.vRRv...',
'..PP....', '..PPP...',

const PALC={O:'#a8741a',h:'#fff0a8',g:'#f2c14e',G:'#d49a24'};
const COIN=[['.OOO.','OhhgO','OhgGO','OgGGO','.OOO.'],['.O.','OhO','OgO','OGO','.O.'],['O','h','g','G','O'],['.O.','OhO','OgO','OGO','.O.']].map(r=>sprite(r,PALC)),
  COINF=sprite(['.OOO.','OhggO','.OOO.'],PALC);
const FONT={S:['###','#..','###','..#','###'],A:['.#.','#.#','###','#.#','#.#'],L:['#..','#..','#..','#..','###'],
  O:['###','#.#','#.#','#.#','###'],N:['#..#','##.#','#.##','#..#','#..#'],T:['###','.#.','.#.','.#.','.#.'],

  W:['#.#.#','#.#.#','#.#.#','#.#.#','.#.#.'],G:['###','#..','#.#','#.#','###'],C:['###','#..','#..','#..','###'],K:['#.#','#.#','##.','#.#','#.#'],

const textW=s=>[...s].reduce((n,ch)=>n+FONT[ch][0].length+1,-1);
function text(x,y,s,c,drop){
  [...s].forEach((ch,k)=>{const g=FONT[ch];
    if(!drop||hash(drop+k*7)<.6)g.forEach((row,j)=>[...row].forEach((p,i)=>{if(p==='#')P(x+i,y+j,c);}));
    x+=g[0].length+1;});
}

// ---------- audio
let AC=null,master,pianoBus,windBus,noiseBuf,muted=false,nextNote=0,noteIdx=0;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.6;master.connect(AC.destination);
    pianoBus=AC.createGain();pianoBus.gain.value=0;pianoBus.connect(master);
    windBus=AC.createGain();windBus.gain.value=0;
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=.6;
    src.connect(bp);bp.connect(windBus);windBus.connect(master);src.start();
  }catch(e){AC=null;}
}
function tone1(f,d,type,v,f2,delay){
  if(!AC||muted||v<=0)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);
}
function burst(d,v){
  if(!AC||muted||v<=0)return;
  const t=AC.currentTime,s=AC.createBufferSource(),g=AC.createGain();s.buffer=noiseBuf;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+d+.02);
}

  pop:v=>{burst(.08,.1*v);tone1(700,.16,'triangle',.06*v,200);},

// a lonesome, harmonica-ish line over the opening; it has its own volume so skipping can hush it
let themeBus=null;
function playTheme(){
  if(!AC||muted)return;
  themeBus=AC.createGain();themeBus.gain.value=1;themeBus.connect(master);
  const t0=AC.currentTime+.3,lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=5.2;lg.gain.value=3.5;lfo.connect(lg);lfo.start(t0);lfo.stop(t0+13);
  for(const [f,at,d] of [[330,0,1.3],[392,1.4,.7],[440,2.2,1.9],[392,4.3,.8],[330,5.2,2.1],[294,7.5,1.1],[262,8.7,.8],[330,9.6,2.6]]){
    const o=AC.createOscillator(),g=AC.createGain(),t=t0+at;o.type='triangle';o.frequency.value=f;lg.connect(o.frequency);
    g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.075,t+.18);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(themeBus);o.start(t);o.stop(t+d+.05);
  }
}
// honky-tonk loop: stride bass under a rolling right-hand figure
const PROG=[0,0,5,0,7,7,0,0],RH=[0,7,4,7,12,7,4,7,4,7,12,7,16,12,7,4];
function pnote(m,t,d,v){
  const f=440*Math.pow(2,(m-69)/12),g=AC.createGain();
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);g.connect(pianoBus);
  for(const [type,det] of [['triangle',0],['square',9]]){
    const o=AC.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=det;
    const og=AC.createGain();og.gain.value=type==='square'?.18:1;o.connect(og);og.connect(g);o.start(t);o.stop(t+d+.02);
  }
}
let pianoVol=0;
function updAudio(){
  const s=G.b[1],open=s.level>0&&!s.building&&G.state==='play';
  pianoVol=open?clamp(1-Math.abs(s.x+43-G.player.x)/280,0,1):0;
  if(!AC)return;
  pianoBus.gain.setTargetAtTime(muted?0:pianoVol*.4,AC.currentTime,.2);
  const gust=.5+.5*Math.sin(G.clock*.31)*Math.sin(G.clock*.13),alive=G.b.filter(b=>b.level).length;
  windBus.gain.setTargetAtTime(muted?0:Math.max(.008,.036-alive*.006)*(.4+gust),AC.currentTime,.3);
  if(nextNote<AC.currentTime)nextNote=AC.currentTime+.05;
  while(nextNote<AC.currentTime+.25){
    if(pianoVol>.02&&!muted){
      const i=noteIdx,st=i%8,root=48+PROG[Math.floor(i/8)%8];
      if(st===0)pnote(root-12,nextNote,.3,.5);
      if(st===4)pnote(root-5,nextNote,.3,.45);
      if(st===2||st===6){pnote(root+4,nextNote,.14,.25);pnote(root+7,nextNote,.14,.25);}
      if(hash(i*1.7)>.18)pnote(root+12+RH[i%16],nextNote,.16,.4);
    }
    noteIdx++;nextNote+=.19;
  }
}

// ---------- time of day
function darkness(t){
  if(t<.06)return .5*(1-t/.06);
  if(t<.58)return 0;
  if(t<.70)return (t-.58)/.12;
  if(t<.94)return 1;
  return 1-.5*(t-.94)/.06;
}
const warmth=t=>Math.max(0,1-Math.abs(t-.61)/.09,1-Math.min(Math.abs(t-1),t)/.05);
const SKY=[[0,'#5b6494','#f2b27c'],[.08,'#6fb0d4','#f3e0b5'],[.5,'#6fb0d4','#f3e0b5'],[.6,'#5a4a86','#f6a35a'],[.66,'#3a2a5c','#e8703f'],
  [.73,'#0b0d24','#2b2350'],[.93,'#0b0d24','#2b2350'],[1.001,'#5b6494','#f2b27c']].map(k=>[k[0],rgb(k[1]),rgb(k[2])]);
function skyAt(t){
  let i=0;while(SKY[i+1][0]<=t)i++;
  const a=SKY[i],b=SKY[i+1],k=(t-a[0])/(b[0]-a[0]);
  return [mixA(a[1],b[1],k),mixA(a[2],b[2],k)];
}

// ---------- spawning
function coin(x,h,vx,vh,free){G.coins.push({x,h,vx,vh,st:'air',age:0,claimed:null,free:!!free});}
function dust(x,h,n,col,up){
  for(let i=0;i<n;i++)G.parts.push({x:x+rnd(-2,2),h:h+rnd(0,2),vx:rnd(-10,10),vh:up?rnd(8,16):rnd(4,14),life:0,max:rnd(.5,1.1),col:col||'#e2c08c',grav:up?0:-14});
}
function drifter(camp,fromEdge,x){
  const c=G.camps[camp],side=Math.random()<.5?-1:1,home=c.x+side*rnd(8,17);
  G.drifters.push({id:G.nextId++,camp,home,x:x!==undefined?x:fromEdge?clamp(c.x+(c.x<MID?-260:260),14,WORLD-14):home,dir:-side,walk:0,target:null,moving:false});
}
function arrivals(){G.camps.forEach((c,i)=>{if(G.folk.length+G.drifters.length<popCap()&&G.drifters.filter(d=>d.camp===i).length<c.cap)drifter(i,true);});}
const nearCamp=x=>G.camps.reduce((b,c,i)=>Math.abs(c.x-x)<Math.abs(G.camps[b].x-x)?i:b,0);
const townie=(id,x,dir)=>G.folk.push({id,x,dir,walk:0,goal:'',tx:x,wait:0,at:false,hidden:false,moving:false,role:'folk',badge:null,ham:0,cd:0});
const spark=(x,h,n,col)=>{for(let i=0;i<n;i++)G.parts.push({x:x+rnd(-3,3),h:h+rnd(-2,3),vx:rnd(-9,9),vh:rnd(-4,12),life:0,max:rnd(.3,.6),col:col||'#fff3b0',grav:0,lit:1,star:1});};
const confetti=(x,h,n)=>{for(let i=0;i<n;i++)G.parts.push({x:x+rnd(-6,6),h,vx:rnd(-30,30),vh:rnd(25,70),life:0,max:rnd(1,1.9),col:['#b53a2e','#ead7a4','#3f5fa0','#f2c14e','#5d8a4e'][i%5],grav:-90,conf:1});};

function spawnBandit(side,kind,more){
  const g=G.b[side<0?6:7],K=KIND[kind],hp=K[0]+(more||0);let x=g.x+side*340;if(Math.abs(G.player.x-x)<W*.8)x+=side*W;
  G.bandits.push({id:G.nextId++,kind,x:clamp(x,-10,WORLD+10),dir:-side,side,hp,max:hp,state:'raid',loot:0,walk:0,cd:0,cd2:2,hurt:0,vx:0,phase:0,moving:true,rustle:Math.random()<.4,tx:rnd(TOWN[0],TOWN[1])});

function dawn(){
  for(const f of G.folk)if(f.role==='folk')coin(f.hidden?G.b[1].x+43:f.x,6,rnd(-22,22),rnd(50,75),true);
  for(const b of G.b){
    const d=DEF[b.type];
    if(b.level&&d.pay&&!b.robbed)for(let i=0;i<d.pay*b.level;i++)coin(b.x+d.door.x+7,5,rnd(-40,40),rnd(55,90),true);
    b.robbed=false;if(d.gate)b.hp=GHP[b.level];
  }
  // grown cattle pay 2 coins a head, left in the pasture; the bank pays a little interest
  if(G.coins.filter(c=>c.st==='ground'&&c.x>PASTURE[0]-20&&c.x<PASTURE[1]+20).length<12)for(const c of G.herd)if(!c.calf)for(let i=0;i<2;i++)coin(c.x,4,rnd(-14,14),rnd(35,60),true);
  for(const c of G.herd)c.calf=0;
  G.bank+=Math.min(3*G.b[5].level,G.bank>>3);G.raid=[];
  // the bordello draws a newcomer per level, who settles straight in
  for(let i=0;i<G.b[10].level;i++)if(G.folk.length+G.drifters.length<popCap())townie(G.nextId++,G.b[10].x+37+i*5,1);
  arrivals();G.duskDone=false;save();
  if(G.folk.length)hint('dawn');
}
function dusk(){
  // nights are counted from your arrival, and each town down the line starts rougher
  G.duskDone=true;if(G.b[1].level)arrivals();
  const ln=G.day-G.day0,d=ln+G.town;if(d<2)return;
  const n=Math.min(d-1+Math.max(0,d-5)+G.town,12+G.town*2),s0=Math.random()<.5?1:-1,boss=ln>=4&&ln%3===1;
  for(let i=0;i<n;i++)G.raid.push({t:.74+Math.random()*.09,side:i%2?s0:-s0,kind:d>=4&&i%3===2?'rider':'bandit',hp:d>>2});
  if(boss)G.raid.push({t:.79,side:s0,kind:'boss',hp:d>>1});
  // from the eighth night, every fifth night a gang of horsemen charges one end of town
  const gang=ln>=8&&ln%5===3;
  if(gang)for(let i=0;i<Math.min(2+(ln>>1),14);i++)G.raid.push({t:.77+Math.random()*.05,side:s0,kind:'rider',hp:d>>2});
  hint(gang?'gang':boss?'boss':'raid',gang||boss,gang?`A gang of horsemen is riding in from the ${s0<0?'west':'east'} tonight. Wire and a strong gate on that side will break the charge.`:undefined);sfx.sting();
}
// ---------- cinematics: letterbox bars, captions in the lower bar, and a title card
const cine=on=>document.body.classList.toggle('cine',on),glance=on=>document.body.classList.toggle('peek',on);
let capTimer=0;
function caption(txt){
  const el=$('cap');el.classList.remove('on');clearTimeout(capTimer);
  if(txt)capTimer=setTimeout(()=>{el.textContent=txt;el.classList.add('on');},380);
}
function card(title,sub,ms){
  const el=$('card'),sm=document.createElement('small');el.textContent=title;sm.textContent=sub;el.append(sm);
  el.classList.add('on');setTimeout(()=>el.classList.remove('on'),ms||3200);

// the opening: night gives way to sunrise while the camera drifts down the dead main street, then a rider comes in from the east
const INTRO=[[.7,'The railroad went another way, and Dustfall emptied out.'],[4.5,'Years later, one rider came back.'],[7.7,'All he carried was a purse of coins.'],[10.3,'']];
function beginIntro(){
  const p=G.player;G.state='intro';G.intro={t:0,cap:0,card:0};G.t=.955;p.x=FIRE_X+470;p.dir=-1;p.vx=0;
  $('title').hidden=true;document.body.classList.remove('title');cine(true);playTheme();
}
function updIntro(dt){
  const I=G.intro,p=G.player,ease=u=>u*u*(3-2*u);I.t+=dt;
  while(I.cap<INTRO.length&&I.t>=INTRO[I.cap][0])caption(INTRO[I.cap++][1]);
  G.t=(.955+Math.min(I.t,12)/12*.125)%1;G.dark=darkness(G.t);
  if(I.t>3.6){
    p.vx=-(p.x>FIRE_X+12?62:Math.max(0,(p.x-FIRE_X+20)*2));p.x=Math.max(FIRE_X-20,p.x+p.vx*dt);p.phase+=Math.abs(p.vx)*dt*.085;
    const st=Math.floor(p.phase*4/Math.PI);if(st!==p.st){p.st=st;if(p.vx<-10)sfx.hoof(.8);}
    if(p.vx<-55&&Math.random()<dt*14)dust(p.x+8,0,1);
  }
  const pan=1100+ease(clamp(I.t/4.6,0,1))*520-W/2,k=ease(clamp((I.t-4.2)/1.8,0,1));
  G.cam=clamp(pan+(p.x-W*.42-pan)*k,0,WORLD-W);
  if(I.t>10.4&&!I.card){I.card=1;card('Dustfall','Day 1',3400);sfx.chord();}
  if(I.t>12.6)endIntro();
}
function endIntro(skipped){
  if(G.state!=='intro')return;
  const p=G.player;p.x=FIRE_X-20;p.vx=0;p.dir=-1;p.lock=true;G.intro=null;G.t=.08;G.state='play';
  cine(false);caption('');hint('start');
  if(skipped){G.fade=1;G.cam=clamp(p.x-W*.6,0,WORLD-W);$('card').classList.remove('on');if(themeBus&&AC)themeBus.gain.setTargetAtTime(0,AC.currentTime,.2);}
}
function banner(state,h,tag,btn){
  G.focus=null;glance(false);cine(false);G.state=state;$('hint').classList.remove('on');$('title').hidden=false;document.body.classList.add('title');$('cont').hidden=true;
  if(state==='over')try{localStorage.removeItem(SAVE);}catch(e){}else save();
  $('title').querySelector('h1').textContent=h;$('tag').textContent=tag;$('go').textContent=btn;$('how').textContent='';
}
// boarding the train: it pulls out east, the screen fades, and you step off at the next dead town with half your coins
function startTrip(){G.trip={t:0};G.player.vx=0;sfx.whistle();}
function nextTown(){
  const p=G.player,carry=clamp((p.coins+G.bank)>>1,8,25),keep={town:G.town+1,day:G.day+1,seen:G.seen};
  reset();Object.assign(G,keep,{day0:keep.day-1,state:'play',t:.08,fade:1});G.player.coins=carry;G.player.lock=true;
  card(nice(townName()),'The next town down the line',3600);sfx.chord();
  hint('arrive',true,`${nice(townName())}. The line ends at another dead town, and this one is rougher. You stepped off with ${carry} coins.`);save();
}

// ---------- save: kept in this browser; written each dawn, when something is built, and when the page is hidden
const SAVE='dustfall-save-1';
function save(){
  if(G.state!=='play'&&G.state!=='won')return;
  if(G.trip)return;
  try{localStorage.setItem(SAVE,JSON.stringify({v:3,day:G.day,day0:G.day0,town:G.town,bank:G.bank,herd:G.herd.length,t:G.t,dusk:G.duskDone,coins:G.player.coins,px:G.player.x,nextId:G.nextId,deps:G.deps,seen:G.seen,train:!!G.train,
    b:G.b.map(b=>[b.level,b.badges,b.paid,+b.building,b.progress,b.hp]),boxes:G.boxes.map(b=>b.open),
    folk:G.folk.map(f=>[f.id,f.role,Math.round(f.x),f.side,f.slot]),dr:G.drifters.map(d=>[d.id,d.camp,Math.round(d.x)])}));}catch(e){}
}
function peek(){try{return JSON.parse(localStorage.getItem(SAVE));}catch(e){return null;}}
function load(){
  const s=peek();if(!s)return false;
  // a save from before the map was widened: everything sat 600 further west and there were only two camps and two strongboxes
  if(!s.v){s.px+=600;s.folk.forEach(f=>f[2]+=600);s.dr.forEach(d=>{d[1]=d[1]?2:1;d[2]+=600;});s.boxes=[false,s.boxes[0],s.boxes[1],false];}
  if(!(s.v>2)){const mv=x=>x>1480?x+100:x;s.px=mv(s.px);s.folk.forEach(f=>f[2]=mv(f[2]));s.dr.forEach(d=>d[2]=mv(d[2]));}
  reset();G.drifters.length=0;
  Object.assign(G,{day:s.day,day0:s.day0||0,town:s.town||0,bank:s.bank||0,t:s.t,duskDone:s.dusk,deps:s.deps,seen:s.seen,train:s.train?{x:STOP,v:0,chuff:0,wait:0}:null,cam:clamp(s.px-W/2,0,WORLD-W)});
  G.player.coins=s.coins;G.player.x=s.px;
  s.b.forEach((v,i)=>Object.assign(G.b[i],{level:v[0],badges:v[1],paid:v[2],building:!!v[3],progress:v[4],hp:v[5]||0}));
  for(let i=0;i<(s.herd||0);i++){cow();G.herd[i].calf=0;}
  s.boxes.forEach((o,i)=>G.boxes[i].open=o);
  for(const [id,role,x,side,slot] of s.folk){townie(id,x,1);Object.assign(G.folk[G.folk.length-1],{role,side,slot,px:x});}
  for(const [id,camp,x] of s.dr){drifter(camp,false,x);G.drifters[G.drifters.length-1].id=id;}
  G.nextId=s.nextId;return true;
}

// ---------- update
function slotPos(b,i,n){
  const cols=n>10?7:5,rows=Math.ceil(n/cols),row=Math.floor(i/cols),inRow=row<rows-1?cols:n-cols*(rows-1);
  return {x:Math.round(b.x+b.w/2-(inRow-1)*3)+(i%cols)*6,h:topOf(b,b.level)+22+(rows-1-row)*6};
}
const zoneOf=x=>G.b.find(b=>(!DEF[b.type].virt||(G.train&&!G.train.v&&!G.trip))&&x>b.x-6&&x<b.x+b.w+12);
// what a coin tossed from x would pay for: a tool rack, a building's next level, or a bank deposit
function target(x){
  for(const b of G.b)if(DEF[b.type].tool&&b.level&&Math.abs(x-rackX(b))<9)return b.badges+b.incoming<3?{b,k:'badge'}:null;
  const b=zoneOf(x);if(!b||b.building)return null;
  const cost=costOf(b);
  return cost&&b.paid+b.incoming<cost?{b,k:'slot'}:b.type==='bank'&&b.level?{b,k:'bank'}:null;
}
function tossCoin(tg,fromBank){
  const p=G.player,b=tg&&tg.b,fly=(st,tx,th)=>G.coins.push({x:p.x,h:16,st,b,tx,th,age:0,d0:Math.hypot(tx-p.x,th-16)});
  if(fromBank)G.bank--;else p.coins--;
  p.toss=.25;sfx.toss();
  if(!tg)coin(p.x+p.dir*7,15,p.dir*26+p.vx*.4,45,false);
  else if(tg.k==='slot'){const cost=costOf(b),sp=slotPos(b,b.paid+b.incoming,cost);p.lock=++b.incoming+b.paid>=cost;fly('slot',sp.x,sp.h-2);}
  else if(tg.k==='badge'){fly('badge',rackX(b)-2+(b.badges+b.incoming)*3,12);b.incoming++;}
  else{fly('bank',b.x+32,12);if(!p.coins)p.lock=true;}
}
function updPlayer(dt){
  // keys and d-pad: hold to gallop. Sticks are analog: a light push walks, a full push gallops straight away
  const p=G.player,a=input.stick||input.padAxis,dig=input.key||input.dpad,d=dig||(Math.abs(a)>.25?Math.sign(a):0);
  if(d){p.dir=d;p.hold+=dt;}else p.hold=0;
  const want=d*((dig?p.hold>.45:Math.abs(a)>.75)?[78,104,118][G.b[3].level]:40),rate=(!d||want*p.vx<0?950:360)*dt;
  if(!d&&Math.abs(p.vx)>50)dust(p.x+Math.sign(p.vx)*9,0,2);
  p.vx+=clamp(want-p.vx,-rate,rate);p.x+=p.vx*dt;
  if(p.x<30){p.x=30;p.vx=0;}if(p.x>WORLD-30){p.x=WORLD-30;p.vx=0;}
  const sp=Math.abs(p.vx);
  p.phase+=sp*dt*.085;p.toss-=dt;
  const st=Math.floor(p.phase*4/Math.PI);
  if(st!==p.st){p.st=st;if(sp>10){sfx.hoof(sp>55?1:.6);G.prints.push({x:p.x-p.dir*(st&1?6:-4),t:0});if(G.prints.length>60)G.prints.shift();}}
  if(sp>60&&Math.random()<dt*16)dust(p.x-p.dir*8,0,1);
  p.cd-=dt;
  const drop=input.dropKey||input.dropTouch||input.padDrop;if(!drop)p.lock=false;
  if(drop&&!p.lock&&p.cd<=0){
    const tg=target(p.x),zb=zoneOf(p.x);
    if(!tg&&zb&&!zb.building&&DEF[zb.type].cost[zb.level]&&zb.level>=cap(zb)){
      p.lock=true;sfx.empty();hint('cap',true,`The ${label(zb)} is as good as it gets for now. Upgrade the town centre, at the campfire in the middle of town, to improve it further.`);
    }else if(tg&&tg.k!=='bank'&&G.bank>0){tossCoin(tg,true);p.cd=.22;}   // building work and tools are paid from the bank first
    else if(p.coins>0){tossCoin(tg);p.cd=.22;}
    else if(tg&&G.bank>0){                      // empty purse at the bank: the teller hands five back
      const n=Math.min(5,G.bank);G.bank-=n;p.lock=true;sfx.box();for(let i=0;i<n;i++)G.coins.push({x:tg.b.x+32,h:10,st:'back',age:-i*.07});
    }else if(!G.b.some(b=>b.paid)){sfx.empty();p.cd=.5;hint('broke',true);}
  }
  for(const b of G.boxes)if(!b.open&&Math.abs(b.x-p.x)<10){
    b.open=true;for(let i=0;i<(b.n||4);i++)coin(b.x,4,rnd(-34,34),rnd(60,95),true);sfx.box();dust(b.x,2,6);hint('box');
  }
}
function updCoins(dt){
  const p=G.player;
  for(let i=G.coins.length-1;i>=0;i--){
    const c=G.coins[i];c.age+=dt;
    if(c.st==='air'){
      c.vh-=260*dt;c.x=clamp(c.x+c.vx*dt,8,WORLD-8);c.h+=c.vh*dt;
      if(c.h<=0){c.h=0;if(c.vh<-45){c.vh*=-.35;c.vx*=.5;sfx.clink(near(c.x));}else c.st='ground';}
    }else if(c.st==='ground'){
      if(!c.claimed&&c.age>(c.free?.5:2.2)&&Math.abs(c.x-p.x)<13&&!G.trip){c.st='back';c.age=0;}
    }else if(c.st==='back'){
      const dx=p.x-c.x,dh=14-c.h,dist=Math.hypot(dx,dh),step=200*dt;if(c.age<0)continue;
      if(dist>step){c.x+=dx/dist*step;c.h+=dh/dist*step;}else{G.coins.splice(i,1);p.coins++;sfx.pick();spark(p.x,13,2);}
    }else{
      const dx=c.tx-c.x,dh=c.th-c.h,dist=Math.hypot(dx,dh),step=150*dt,b=c.b;
      if(dist>step){c.x+=dx/dist*step;c.h+=dh/dist*step;continue;}
      G.coins.splice(i,1);sfx.slot();spark(c.tx,c.th+2,3);
      if(c.st==='bank'){G.bank++;hint('deposit');continue;}
      b.incoming--;
      if(c.st==='badge'){b.badges++;continue;}
      if(++b.paid<costOf(b))continue;
      if(DEF[b.type].virt){b.paid=0;startTrip();}
      else{b.building=true;b.progress=0;hint(G.folk.some(f=>f.role==='folk')?'funded':'noworkers');}
    }
  }
}
function step(o,tx,speed,dt){
  const dx=tx-o.x;
  if(Math.abs(dx)>1){o.dir=Math.sign(dx);o.x+=o.dir*Math.min(speed*dt,Math.abs(dx));o.walk+=dt*9;o.moving=true;return false;}
  o.moving=false;return true;
}
function updDrifters(dt){
  for(const d of [...G.drifters]){
    if(!d.target){
      let best=null,bd=90;
      for(const c of G.coins)if(c.st==='ground'&&!c.claimed&&Math.abs(c.x-d.x)<bd){bd=Math.abs(c.x-d.x);best=c;}
      if(best){d.target=best;best.claimed=d;}
    }
    if(d.target&&!G.coins.includes(d.target))d.target=null;
    if(!d.target)step(d,d.home,20,dt);
    else if(step(d,d.target.x,30,dt)){G.coins.splice(G.coins.indexOf(d.target),1);recruit(d);}
  }
}
function updFolk(dt){
  const site=G.b.find(b=>b.building),sal=G.b[1],night=G.dark>.55;
  const plain=G.folk.filter(f=>f.role==='folk'),ranchers=G.folk.filter(f=>f.role==='rancher').length;
  for(const b of G.b)if(b.badges>plain.filter(f=>f.badge===b).length){
    const c=plain.filter(f=>!f.badge).sort((a,z)=>Math.abs(a.x-rackX(b))-Math.abs(z.x-rackX(b)))[0];if(c)c.badge=b;
  }
  for(const f of G.folk){
    if(f.role==='deputy'){updDeputy(f,dt);continue;}
    const job=f.role==='miner'?'mine':f.role==='rancher'?'ranch':'',goal=f.badge?'badge':site&&!job?'build'+site.x:night?(sal.level?'inside':'fire'):job||'wander';
    if(goal!==f.goal){

      f.tx=f.badge?rackX(f.badge):goal==='mine'?MINE-4+(f.id%4)*13:goal==='ranch'?PASTURE[0]+10+(f.id%4)*28:goal==='inside'?sal.x+43:goal==='fire'?FIRE_X+(f.id%2?1:-1)*(9+(f.id>>1)%4*6):site?site.x+8+(f.id%5)*(site.w-16)/4:rnd(TOWN[0],TOWN[1]);
    }

      if(f.role==='deputy'){f.side=G.deps%2?1:-1;f.slot=G.deps>>1;G.deps++;f.px=f.x;}

    }else if(goal==='ranch'){

    }else if(goal.startsWith('build')){

}
function updDeputy(f,dt){
  f.cd-=dt;f.hidden=false;
  const up=G.b[2].level>1,gW=G.b[6],gE=G.b[7];      // a watchtower gives them more range and a quicker reload
  let tgt=null,bd=up?215:170;
  for(const q of G.bandits){const d=Math.abs(q.x-f.x);if(d<bd){bd=d;tgt=q;}}f.aim=!!tgt;
  if(tgt){
    f.dir=Math.sign(tgt.x-f.x)||1;
    if(bd>100&&!step(f,clamp(tgt.x,gW.x+18,gE.x-6),32,dt))return;
    f.moving=false;
    if(f.cd<=0){
      f.cd=up?.75:1;f.flash=.08;const hit=Math.random()<.7;
      G.shots.push({x0:f.x+f.dir*8,x1:hit?tgt.x:tgt.x+f.dir*rnd(20,50),h:9,hit});sfx.shot(near(f.x));
      if(hit){tgt.hp-=G.b[2].level>2?2:1;tgt.hurt=.18;dust(tgt.x,8,3,'#d04a3a');if(tgt.hp<=0)killBandit(tgt);}

    if(guard)f.dir=f.side;

  }
}
function killBandit(q){

function breakGate(g){

function updBandits(dt){

function banditAct(q,dt,p){
  // barbed wire on their side slows them to a crawl and throws riders, who carry on on foot
  const wr=G.b[q.side<0?11:12],snag=q.state==='raid'&&wr.level&&q.x>wr.x-2&&q.x<wr.x+wr.w+2;
  if(snag&&q.kind==='rider'){q.kind='bandit';dust(q.x,6,12);sfx.crash(near(q.x)*.5);hint('thrown');}
  const K=KIND[q.kind],sp=K[1]*(snag?.4:1);
  if(q.state==='flee'){
    step(q,q.side<0?-40:WORLD+40,sp+6,dt);
    if(q.x<-20||q.x>WORLD+20)G.bandits.splice(G.bandits.indexOf(q),1);
    return;
  }
  if(q.kind==='boss'&&(q.cd2-=dt)<=0){
    // the outlaw shoots back, and a hit costs a deputy his badge
    const t=G.folk.filter(f=>f.role==='deputy'&&Math.abs(f.x-q.x)<150).sort((a,z)=>Math.abs(a.x-q.x)-Math.abs(z.x-q.x))[0];
    if(t){
      q.cd2=2.4;G.shots.push({x0:q.x+Math.sign(t.x-q.x)*6,x1:t.x,h:10,hit:1,col:'#ff9a6a'});sfx.shot(near(q.x));

    }
  }
  // a standing gate on their side has to be broken down first, unless you are out there with them
  const dp=p.x-q.x,g=G.b[q.side<0?6:7];
  if(g.level&&g.hp>0&&(q.side<0?q.x>g.x-9&&q.x<=g.x+2:q.x<g.x+g.w+9&&q.x>=g.x+g.w-2)&&!(Math.abs(dp)<75&&(p.x-g.x)*q.side>0)){
    q.moving=false;q.dir=-q.side;
    if(q.cd<=0){q.cd=1.3;g.hp-=K[2];g.shake=.2;sfx.hammer(near(g.x));dust(g.x+7,8,3,'#b89a66');if(g.hp<=0)breakGate(g);}
    return;
  }
  let c=null,bd=55;
  if(q.kind!=='boss')for(const k of G.coins)if(k.st==='ground'&&!k.claimed&&Math.abs(k.x-q.x)<bd){bd=Math.abs(k.x-q.x);c=k;}
  if(c){if(step(q,c.x,sp,dt)){G.coins.splice(G.coins.indexOf(c),1);q.loot++;q.state='flee';}return;}
  if(Math.abs(dp)<75){

      q.cd=1.6;G.shake=.3;G.flash=.3;sfx.hit();
      if(p.coins<=0&&G.bank<=0){gameOver();return;}
      if(p.coins<=0){const n=Math.min(5,G.bank);G.bank-=n;q.loot+=n;q.state='flee';hint('paidoff',true);return;}
      const n=Math.min(K[3],p.coins);p.coins-=n;
      for(let i=0;i<n;i++)coin(p.x,14,rnd(-50,50),rnd(60,90),false);
      hint('hit');
    }
    return;
  }
  const cw=q.rustle&&G.herd.find(k=>Math.abs(k.x-q.x)<80);
  if(cw){
    if(step(q,cw.x,sp,dt)){G.herd.splice(G.herd.indexOf(cw),1);q.loot+=2;q.state='flee';sfx.moo(near(q.x));dust(q.x,4,6);hint('rustle',true);}
    return;
  }
  let f=null;bd=60;
  for(const k of G.folk)if(k.role!=='deputy'&&!k.hidden&&Math.abs(k.x-q.x)<bd){bd=Math.abs(k.x-q.x);f=k;}
  if(f){
    if(step(q,f.x,sp,dt)){
      G.folk.splice(G.folk.indexOf(f),1);drifter(nearCamp(f.x),false,f.x);
      q.loot++;q.state='flee';dust(f.x,4,6);sfx.empty();hint('mug');
    }
    return;
  }
  // the outlaw goes for the bank; the rest rob whatever pays out in the morning
  const bank=G.b[5];
  if(q.kind==='boss'&&bank.level===1&&G.bank>0&&!bank.robbed){
    if(step(q,bank.x+32,sp,dt)){const n=Math.min(G.bank,10);G.bank-=n;q.loot+=n;bank.robbed=true;q.state='flee';sfx.box();dust(q.x,6,8);hint('bankrob',true);}
    return;
  }
  const b=G.b.filter(b=>b.level&&!b.robbed&&!b.building&&DEF[b.type].pay).sort((a,z)=>Math.abs(a.x-q.x)-Math.abs(z.x-q.x))[0];
  if(b){if(step(q,b.x+DEF[b.type].door.x+7,sp-4,dt)){b.robbed=true;q.loot+=2;q.state='flee';sfx.box();dust(q.x,6,8);hint('robbed',true);}return;}
  if(step(q,q.tx,sp-10,dt))q.tx=rnd(TOWN[0],TOWN[1]);
}

    const cost=costOf(b),d=DEF[b.type],bar=(x,y,k)=>{R(x-1,y-1,16,3,'#24160f');R(x,y,Math.round(14*k),1,k>.5?'#8fcf6a':'#e0633c');};
    // coin slots over whatever you are about to pay for, the three hooks of a tool rack, and a gate's health once it is damaged
    if(cost&&!b.building&&(b.paid+b.incoming>0||(tg&&tg.b===b&&tg.k==='slot')))for(let i=0;i<cost;i++){const q=slotPos(b,i,cost);slot(Math.round(q.x-cam),GY-q.h,i<b.paid,i===b.paid+b.incoming);}
    if(d.tool&&b.level&&Math.abs(p.x-rackX(b))<9)for(let i=0;i<3;i++)slot(Math.round(rackX(b)-cam)-6+i*6,GY-26,i<b.badges+b.incoming,i===b.badges+b.incoming);
    if(d.gate&&b.level&&b.hp<GHP[b.level])bar(b.x-cam,GY-topOf(b,b.level)-10,b.hp/GHP[b.level]);
  }
  for(const q of G.bandits)if(q.kind==='boss'){const x=Math.round(q.x-cam)-7;R(x-1,GY-24,16,3,'#24160f');R(x,GY-23,Math.round(14*q.hp/q.max),1,'#e0633c');}
  if(Math.sin(G.clock*9)>0)for(const side of [-1,1])if(G.bandits.some(q=>side<0?q.x-cam<4:q.x-cam>W-4)){
    const x=side<0?2:W-3,y=GY-9;for(let k=0;k<4;k++)R(x-side*k,y-k,1,k*2+1,'#ff5a3c');
  }
  // a low sun blooms and streaks across the frame
  if(G.t<.68){
    const k=G.t/.66,low=Math.pow(1-Math.sin(clamp(k,0,1)*Math.PI),2),x=W*(.1+.8*k),y=GY-4-Math.sin(k*Math.PI)*(GY*.82);
    if(low>.12){glow(x,y,46+low*30,'255,170,90',.2*low);glow(x,y,W*.55,'255,190,120',.13*low,.07);}
  }
  drawFore(cam);
  const vg=ctx.createRadialGradient(W/2,H*.45,H*.45,W/2,H*.45,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(20,10,6,0)');vg.addColorStop(1,'rgba(20,10,6,.42)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(G.flash>0)R(0,0,W,H,`rgba(200,40,30,${G.flash*.8})`);
  if(G.fade>0)R(0,0,W,H,`rgba(12,7,5,${G.fade})`);
  // sky goes in behind everything: clouds, sun or moon, stars, then the gradient
  ctx.globalCompositeOperation='destination-over';
  const cc=css(mixA(mixA([255,250,240],sb,.4),[46,44,80],dark*.85)),cs=css(mixA(mixA(mixA([225,205,195],sb,.6),[255,140,90],warmth(G.t)*.55),[34,32,64],dark*.85));
  for(let i=0;i<6;i++){
    const w=26+Math.floor(hash(i+400)*30),span=W+140,x=Math.round(((hash(i+410)*span+G.clock*(1.2+hash(i+420)*1.6)-cam*.04)%span+span)%span)-80,y=Math.round(GY*(.1+hash(i+430)*.42));
    R(x+3,y+3,w-7,1,cs);R(x,y,w,3,cc);R(x+4,y-2,Math.round(w*.5),2,cc);R(x+Math.round(w*.3),y-4,Math.round(w*.32),2,cc);R(x+Math.round(w*.55),y-1,Math.round(w*.3),1,cc);
  }
  const disc=(x,y,r,c,a)=>{ctx.globalAlpha=a;ctx.fillStyle=c;ctx.beginPath();ctx.arc(Math.round(x),Math.round(y),r,0,7);ctx.fill();ctx.globalAlpha=1;};
  if(G.t<.68){
    const k=G.t/.66,x=W*(.1+.8*k),y=GY-4-Math.sin(k*Math.PI)*(GY*.82),low=Math.pow(1-Math.sin(clamp(k,0,1)*Math.PI),2);
    disc(x,y,7+low*2,css(mixA([255,243,196],[255,150,70],low)),1);disc(x,y,13+low*4,'#ffd98a',.25);disc(x,y,22+low*8,'#ffc070',.12);
  }else{
    const k=(G.t-.68)/.32,x=W*(.12+.76*k),y=GY-8-Math.sin(k*Math.PI)*(GY*.7);
    P(x-2,y-1,'#bfc6d8');P(x+1,y+2,'#bfc6d8');R(x,y-3,2,1,'#c9cfdf');disc(x,y,5,'#e8ecf5',1);disc(x,y,11,'#aab4e0',.15);
    if(G.meteor){const m=G.meteor,mx=m.x*W+m.t*80,my=m.y*GY+m.t*34;for(let k=0;k<8;k++){ctx.globalAlpha=(1-m.t/.7)*(1-k/8);P(mx-k*2,my-k*.85,k<2?'#fff':'#cfd6ff');}ctx.globalAlpha=1;}
  }
  const sa=clamp((dark-.35)/.5,0,1);
  // the Milky Way: a dim band of small stars across the sky
  if(sa>0)for(let i=0;i<90;i++){const u=hash(i+500),x=Math.floor(u*W),y=Math.floor(GY*(.62-u*.5)+(hash(i+530)-.5)*GY*.16);if(y>0&&y<GY-22){ctx.globalAlpha=sa*(.2+hash(i+560)*.3);P(x,y,i%3?'#9aa4d8':'#d6dcff');}}
  if(sa>0)for(let i=0;i<70;i++){
    const x=Math.floor(hash(i+70)*W),y=Math.floor(hash(i+90)*(GY-20));ctx.globalAlpha=sa*(.45+.55*Math.sin(G.clock*(1+hash(i)*2)+i*1.7)**2);
    P(x,y,i%7?'#fff':'#ffe9b0');if(i%11===0){P(x-1,y,'#cfd6ff');P(x+1,y,'#cfd6ff');P(x,y-1,'#cfd6ff');P(x,y+1,'#cfd6ff');}
  }
  ctx.globalAlpha=1;
  for(let y=0;y<GY;y++)R(0,y,W,1,css(mixA(st,sb,Math.pow(y/(GY-1),1.3))));     // one shade per row, so the sky is smooth
  R(0,GY,W,H-GY,css(sb));
  ctx.globalCompositeOperation='source-over';
}

// ---------- canvas sizing: whole-number pixel scale; portrait gets a tall sky and leaves room below for the controls
function resize(){
  const dpr=window.devicePixelRatio||1,sw=stage.clientWidth,sh=stage.clientHeight,tall=sw/sh<1.25;
  const ch=tall?Math.min(sh,clamp(sh-210,sw/1.25,sw*1.5)):sh;
  const sc=tall?Math.max(1,Math.round(sw*dpr/200)):Math.max(1,Math.round(ch*dpr/170),Math.ceil(sw*dpr/480));
  W=Math.ceil(sw*dpr/sc);H=Math.ceil(ch*dpr/sc);GY=H-clamp(Math.round(H*.26),30,48);
  cv.width=ppl.width=W;cv.height=ppl.height=H;cv.style.width=W*sc/dpr+'px';cv.style.height=$('cine').style.height=H*sc/dpr+'px';
  ctx.imageSmoothingEnabled=false;
}
reset();addEventListener('resize',resize);resize();
window.dustfall={costOf,target,rackX};   // for the test scripts

// ---------- input
const KEYS={ArrowLeft:-1,a:-1,A:-1,ArrowRight:1,d:1,D:1};
const held=new Set();
addEventListener('keydown',e=>{
  if(G.state==='intro'){e.preventDefault();if(G.intro.t>.6)endIntro(true);return;}
  if(G.state!=='play'){if(e.key==='Enter'||e.key===' '){e.preventDefault();start();}return;}
  if(KEYS[e.key]){held.add(e.key);input.key=KEYS[e.key];e.preventDefault();}
  if(e.key===' '||e.key==='ArrowDown'||e.key==='s'||e.key==='S'){input.dropKey=true;e.preventDefault();}
});
addEventListener('keyup',e=>{
  if(KEYS[e.key]){held.delete(e.key);const last=[...held].pop();input.key=last?KEYS[last]:0;}
  if(e.key===' '||e.key==='ArrowDown'||e.key==='s'||e.key==='S')input.dropKey=false;
});
addEventListener('blur',()=>{held.clear();input.key=0;input.dropKey=false;});
const pad=$('pad'),knob=$('knob'),toss=$('toss');let padId=null;
const padSet=e=>{const r=pad.getBoundingClientRect(),dx=clamp(e.clientX-r.left-r.width/2,-34,34);input.stick=dx/34;knob.style.transform=`translateX(${dx}px)`;};
pad.addEventListener('pointerdown',e=>{padId=e.pointerId;try{pad.setPointerCapture(padId);}catch(_){}padSet(e);e.preventDefault();});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)padSet(e);});
for(const ev of ['pointerup','pointercancel'])pad.addEventListener(ev,e=>{if(e.pointerId===padId){padId=null;input.stick=0;knob.style.transform='';}});
toss.addEventListener('pointerdown',e=>{input.dropTouch=true;toss.classList.add('on');e.preventDefault();});
for(const ev of ['pointerup','pointercancel','pointerleave'])toss.addEventListener(ev,()=>{input.dropTouch=false;toss.classList.remove('on');});addEventListener('contextmenu',e=>e.preventDefault());
const touchy=()=>{document.body.classList.add('touch');if(G.state==='title')$('how').textContent='Push the stick to ride, further to gallop. Tap the coin to toss one.';};
if((window.matchMedia&&matchMedia('(pointer:coarse)').matches)||navigator.maxTouchPoints>0)touchy();
addEventListener('touchstart',touchy,{once:true,passive:true});
// stop long-press text selection, the copy bubble, and double-tap or pinch zoom; real buttons still get their taps
const quiet=e=>{const t=e.target.closest?e.target:e.target.parentElement;if(!t||!t.closest('#go,#cont,#mute'))e.preventDefault();};
for(const ev of ['touchstart','touchmove','touchend','gesturestart','selectstart','dblclick'])document.addEventListener(ev,quiet,{passive:false});
// physical controller: left stick or d-pad rides, A / B / X or right trigger tosses, A or Start begins
let padWas=false;
function pollPad(){
  const gp=navigator.getGamepads?[...navigator.getGamepads()].find(g=>g&&g.connected):null,on=i=>!!(gp&&gp.buttons[i]&&gp.buttons[i].pressed);
  input.padAxis=gp&&Math.abs(gp.axes[0])>.25?gp.axes[0]:0;input.dpad=on(15)-on(14);input.padDrop=[0,1,2,7].some(on);
  const go=on(0)||on(9);if(go&&!padWas){if(G.state==='intro')endIntro(true);else if(G.state!=='play')start();}padWas=go;
}
addEventListener('gamepadconnected',()=>{if(G.state==='title')$('how').textContent='Controller: stick or d-pad to ride, A to toss a coin.';});
$('mute').addEventListener('click',()=>{muted=!muted;$('mute').textContent=muted?'Sound off':'Sound on';$('mute').blur();});

// ---------- start and loop
function start(keep){
  if(G.state==='play'||G.state==='intro')return;
  const fresh=G.state==='title'&&keep!==true&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
  if(G.state==='over')reset();
  initAudio();if(AC&&AC.state==='suspended')AC.resume();
  if(fresh)return beginIntro();
  if(G.state==='won')hint('ticket',true);else if(keep!==true){G.t=.08;hint('start');}
  G.state='play';G.player.lock=true;input.key=input.stick=0;input.dropKey=input.dropTouch=false;held.clear();
  $('title').hidden=true;document.body.classList.remove('title');
}
$('go').addEventListener('click',start);
document.addEventListener('pointerdown',()=>{if(G.state==='intro'&&G.intro.t>.6)endIntro(true);});
$('cont').addEventListener('click',()=>{if(load())start(true);});
if(peek()){$('cont').hidden=false;$('cont').textContent='Continue, day '+peek().day;}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});addEventListener('pagehide',save);
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  pollPad();for(let i=0;i<G.timeScale;i++)update(dt);
  draw();hud();updAudio();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#24160f">
<title>Dustfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
<style>
:root{--ink:#24160f;--cream:#f0dfb4;--gold:#f2c14e;--rust:#a8452e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;touch-action:none}
body{background:var(--ink);color:var(--cream);font-family:Rye,Rockwell,Georgia,serif;overflow:hidden;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#stage{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
canvas{display:block;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none}
#hud{position:absolute;top:10px;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;font-size:20px;text-shadow:0 2px 0 rgba(36,22,15,.85);pointer-events:none}
#purse{display:flex;align-items:center;gap:8px}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--gold);box-shadow:inset -3px -3px 0 #c08a1e,0 2px 0 rgba(36,22,15,.7)}
#day{margin-left:auto}
#mute{pointer-events:auto;font:inherit;font-size:15px;color:var(--cream);background:rgba(36,22,15,.5);border:1px solid rgba(240,223,180,.5);border-radius:4px;padding:4px 10px;cursor:pointer}
#hint{position:absolute;left:50%;top:50px;transform:translateX(-50%);width:max-content;max-width:min(92%,34rem);text-align:center;font-family:Georgia,serif;font-size:15px;line-height:1.35;background:rgba(36,22,15,.85);padding:8px 14px;border-radius:4px;opacity:0;transition:opacity .4s;pointer-events:none}
#hint.on{opacity:1}
#pad,#toss{position:absolute;bottom:18px;display:none;touch-action:none;-webkit-tap-highlight-color:transparent}
.touch #pad{display:grid}
.touch #toss{display:grid}
.title #pad,.title #toss,.title #hud{display:none}
#pad{left:max(14px,env(safe-area-inset-left,0px));width:124px;height:124px;border-radius:50%;place-items:center;background:rgba(36,22,15,.4);border:2px solid rgba(240,223,180,.5)}
#pad svg{position:absolute;top:50%;margin-top:-9px;width:18px;height:18px;fill:var(--cream);opacity:.5;pointer-events:none}
#pad svg:first-of-type{left:7px}
#pad svg:last-of-type{right:7px}
#knob{width:54px;height:54px;border-radius:50%;background:rgba(240,223,180,.88);box-shadow:inset -5px -6px 0 rgba(120,90,50,.5),0 3px 0 rgba(36,22,15,.6);pointer-events:none}
#toss{right:max(20px,env(safe-area-inset-right,0px));bottom:34px;width:88px;height:88px;border-radius:50%;place-items:center;padding:0;background:rgba(36,22,15,.45);border:2px solid rgba(242,193,78,.85)}
#toss.on{background:rgba(242,193,78,.3)}
#toss .coin{width:38px;height:38px;box-shadow:inset -5px -5px 0 #c08a1e}
#title{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:12px;padding:20px;background:linear-gradient(rgba(36,22,15,.1),rgba(36,22,15,.6))}
#title h1{margin:0;font-weight:400;font-size:clamp(46px,12vw,108px);line-height:1;letter-spacing:.02em;text-shadow:0 4px 0 var(--rust),0 8px 0 var(--ink)}
#title p{margin:0;font-family:Georgia,serif;font-size:17px;text-shadow:0 1px 0 var(--ink),0 0 8px var(--ink)}
#go{font:inherit;font-size:22px;color:var(--ink);background:var(--gold);border:0;border-bottom:4px solid #b9861f;border-radius:4px;padding:10px 28px 8px;margin-top:6px;cursor:pointer}
#cont{font:inherit;font-size:16px;color:var(--cream);background:rgba(36,22,15,.6);border:1px solid rgba(240,223,180,.6);border-radius:4px;padding:8px 20px 6px;cursor:pointer}
#go:focus-visible,#cont:focus-visible,#mute:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
#title[hidden]{display:none}
</style>
</head>
<body class="title">
<div id="stage"><canvas id="game"></canvas></div>
<div id="hud">
  <span id="purse"><i class="coin"></i><b id="coins">8</b></span>
  <span id="day">Day 1</span>
  <button id="mute" type="button">Sound on</button>
</div>
<div id="hint" role="status"></div>
<div id="pad" aria-label="Thumbstick: ride left or right">
  <svg viewBox="0 0 24 24"><path d="M16 4 6 12l10 8z"/></svg><i id="knob"></i><svg viewBox="0 0 24 24"><path d="m8 4 10 8-10 8z"/></svg>
</div>
<button id="toss" type="button" aria-label="Toss a coin"><i class="coin"></i></button>
<div id="title">
  <h1>Dustfall</h1>
  <p id="tag">A dead town, a tired horse, and a purse of coins.</p>
  <button id="go" type="button">Ride in</button>
  <button id="cont" type="button" hidden>Continue</button>
  <p id="how">Arrow keys or A and D to ride. Space to toss a coin.</p>
</div>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const cv=$('game'),stage=$('stage'),ppl=document.createElement('canvas'),pctx=ppl.getContext('2d');
let ctx=cv.getContext('2d'),W=320,H=180,GY=132,G;
const WORLD=1400,DAY_LEN=100,FIRE_X=765,TOWN=[500,1090],STOP=1098,MINE=384;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a);
const hash=n=>{n=Math.sin(n*127.1+3.7)*43758.5453;return n-Math.floor(n);};
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mixA=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const css=a=>`rgb(${a.map(Math.round).join(',')})`;
const R=(x,y,w,h,c)=>{if(w<=0||h<=0)return;ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
const P=(x,y,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),1,1);};
function line(x0,y0,x1,y1,c,t){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;ctx.fillStyle=c;
  for(;;){ctx.fillRect(x0,y0,t||1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}
}
const toneC={};
const tone=(h,f)=>{f=Math.round(f*20)/20;return toneC[h+f]||(toneC[h+f]=css(rgb(h).map(v=>clamp(v*f,0,255))));};

// ---------- buildings: cost per level, morning payout, and the look of each front
const DEF={
  store:{name:'STORE',w:70,h:36,cost:[7],pay:4,tool:'miner',wall:'#7d9484',trim:'#e6d6ac',roof:'#b44a3c',sign:'#35523f',ink:'#ead7a4',
    door:{x:49,w:13,h:20},wins:[{x:6,y:-21,w:35,h:14,big:1}],posts:[-4,70]},
  saloon:{name:'SALOON',w:86,h:40,cost:[6,10],pay:3,wall:'#a9683a',trim:'#6a3c20',roof:'#6a3c20',sign:'#ead7a4',ink:'#8a2b22',
    door:{x:36,w:14,h:21,bat:1},wins:[{x:8,y:-21,w:14,h:12},{x:64,y:-21,w:14,h:12}],posts:[-3,27,58,87]},
  sheriff:{name:'SHERIFF',w:66,h:36,cost:[8],pay:0,tool:'deputy',wall:'#5f7896',trim:'#e6d6ac',roof:'#34445a',sign:'#ead7a4',ink:'#27364a',
    door:{x:8,w:13,h:20},wins:[{x:32,y:-21,w:24,h:13,bars:1}],posts:[-3,67]},
  stable:{name:'STABLE',w:76,h:36,cost:[6],pay:0,barn:1,wall:'#9a4433',trim:'#ead7a4',roof:'#4a2a22',sign:'#ead7a4',ink:'#6a2a20',
    door:{x:26,w:24,h:22,barn:1},wins:[{x:8,y:-19,w:10,h:9},{x:58,y:-19,w:10,h:9}],posts:[]},
  station:{name:'STATION',w:84,h:38,cost:[20],pay:0,wall:'#c9a65a',trim:'#6a2f26',roof:'#4a3a34',sign:'#ead7a4',ink:'#4a2a22',
    door:{x:36,w:13,h:20},wins:[{x:8,y:-21,w:16,h:12},{x:60,y:-21,w:16,h:12}],posts:[-3,28,54,85]}};
const rackX=b=>b.x+(b.type==='store'?-12:b.w+8);
const ends=d=>d.posts.length?[d.posts[0],d.posts[d.posts.length-1]]:[];
const mk=(type,x)=>({type,x,w:DEF[type].w,level:0,paid:0,incoming:0,building:false,progress:0,robbed:false,badges:0});
const topOf=(b,L)=>DEF[b.type].h+(b.type==='saloon'&&L>1?22:0);
function wins(b,L){
  const w=DEF[b.type].wins.slice();
  if(b.type==='saloon'&&L>1)w.push({x:8,y:-51,w:14,h:13},{x:64,y:-51,w:14,h:13},{x:38,y:-43,w:10,h:17,door:1});
  return w;
}

// ---------- state
const input={key:0,stick:0,padAxis:0,dpad:0,dropKey:false,dropTouch:false,padDrop:false};
function reset(){
  G={state:'title',t:.6,day:1,clock:0,dark:0,timeScale:1,cam:560,nextId:1,deps:0,duskDone:false,shake:0,flash:0,raid:[],
    player:{x:745,vx:0,dir:-1,hold:0,phase:0,coins:8,cd:0,toss:0,st:0},
    coins:[],folk:[],drifters:[],bandits:[],parts:[],shots:[],
    weeds:[{x:300,h:0,vh:0,vx:26},{x:1100,h:0,vh:0,vx:-21}],
    b:[mk('store',508),mk('saloon',640),mk('sheriff',800),mk('stable',890),mk('station',1000)],train:null,
    hens:[540,590,705].map((x,i)=>({x,dir:1,t:i,run:0,hop:0,mode:'walk'})),
    boxes:[{x:330,open:false},{x:1326,open:false}],camps:[{x:130},{x:1270}],seen:{}};
  for(let i=0;i<2;i++){drifter(0,false);drifter(1,false);}
  window.G=G;
}

// ---------- sprites
function sprite(rows,pal){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length;
  const mkc=flip=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(pal[ch]){x.fillStyle=pal[ch];x.fillRect(flip?w-1-i:i,j,1,1);}}));return c;};
  return {r:mkc(false),l:mkc(true),w,h};
}
const PAL={h:'#8b4a2b',l:'#a86039',d:'#6b3820',k:'#2e1a12',e:'#120b08',n:'#5e3220',b:'#d8b25a',c:'#b53a2e',S:'#4a2c1a',
  P:'#2f3a55',B:'#1c1410',R:'#b53a2e',v:'#3a2a20',s:'#e2aa7c',H:'#3b2a1e',T:'#7a5a3a'};
const HORSE=sprite([
'.....................k.k..', '....................khhh..',
'...................kkhlhh.', '..................kkhhhehh',
'.................kkklhhhhh', '................kkklhh.hnn',
'...lllllSSSSllkkklhhh.....', '..lhhhhbbbbbbhhhhhhhh.....',
'.hhhhhhbcccbbhhhhhhh......', '.hhhhhhhhhhhhhhhhhh.......',
'.hhhhhhhhhhhhhhhhh........', '.dhhhhhhhhhhhhhhhd........',
'..ddddddddddddddd.........'],PAL);
const RIDER=sprite([
'..HHH...', '..HHH...',
'HHTTTHH.', '..sss...',
'..css...', '.vRRv...',
'.vRRvss.', '.vRRv...',
'..PP....', '..PPP...',
'...PP...', '...PP...',
'...BB...', '...BBB..'],PAL);
const FONT={S:['###','#..','###','..#','###'],A:['.#.','#.#','###','#.#','#.#'],L:['#..','#..','#..','#..','###'],
  O:['###','#.#','#.#','#.#','###'],N:['#..#','##.#','#.##','#..#','#..#'],T:['###','.#.','.#.','.#.','.#.'],
  R:['##.','#.#','##.','#.#','#.#'],E:['###','#..','##.','#..','###'],H:['#.#','#.#','###','#.#','#.#'],
  I:['#','#','#','#','#'],B:['##.','#.#','##.','#.#','##.'],F:['###','#..','##.','#..','#..']};
const textW=s=>[...s].reduce((n,ch)=>n+FONT[ch][0].length+1,-1);
function text(x,y,s,c,drop){
  [...s].forEach((ch,k)=>{const g=FONT[ch];
    if(!drop||hash(drop+k*7)<.6)g.forEach((row,j)=>[...row].forEach((p,i)=>{if(p==='#')P(x+i,y+j,c);}));
    x+=g[0].length+1;});
}

// ---------- audio
let AC=null,master,pianoBus,windBus,noiseBuf,muted=false,nextNote=0,noteIdx=0;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.6;master.connect(AC.destination);
    pianoBus=AC.createGain();pianoBus.gain.value=0;pianoBus.connect(master);
    windBus=AC.createGain();windBus.gain.value=0;
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=.6;
    src.connect(bp);bp.connect(windBus);windBus.connect(master);src.start();
  }catch(e){AC=null;}
}
function tone1(f,d,type,v,f2,delay){
  if(!AC||muted||v<=0)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);
}
function burst(d,v){
  if(!AC||muted||v<=0)return;
  const t=AC.currentTime,s=AC.createBufferSource(),g=AC.createGain();s.buffer=noiseBuf;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+d+.02);
}
const near=x=>clamp(1-Math.abs(x-G.player.x)/240,0,1);
const sfx={
  toss:()=>tone1(900,.08,'square',.05,1400),
  clink:v=>tone1(2100,.06,'triangle',.07*v),
  pick:()=>{tone1(1300,.07,'square',.06);tone1(1900,.1,'square',.06,0,.06);},
  slot:()=>tone1(1500,.12,'triangle',.1,2000),
  recruit:()=>{tone1(520,.1,'triangle',.12);tone1(780,.16,'triangle',.12,0,.09);},
  hammer:v=>tone1(240,.05,'square',.07*v,90),
  pick2:v=>tone1(1700,.04,'triangle',.06*v,900),
  cluck:v=>{tone1(720,.05,'square',.04*v,480);tone1(820,.06,'square',.04*v,520,.09);},
  hoof:v=>tone1(95,.035,'triangle',.05*v,60),
  box:()=>tone1(140,.14,'square',.1,60),
  empty:()=>tone1(160,.08,'square',.04),
  shot:v=>{burst(.16,.3*v);tone1(320,.1,'square',.08*v,70);},
  hit:()=>{burst(.2,.25);tone1(130,.25,'sawtooth',.14,45);},
  whistle:()=>{for(const f of [392,494,587])tone1(f,1.2,'triangle',.07,f*.97);},
  sting:()=>{tone1(147,.5,'sawtooth',.07);tone1(139,.7,'sawtooth',.07,0,.35);},
  fanfare:()=>[523,659,784,1047].forEach((f,i)=>tone1(f,.22,'triangle',.14,0,i*.12))
};
// honky-tonk loop: stride bass under a rolling right-hand figure
const PROG=[0,0,5,0,7,7,0,0],RH=[0,7,4,7,12,7,4,7,4,7,12,7,16,12,7,4];
function pnote(m,t,d,v){
  const f=440*Math.pow(2,(m-69)/12),g=AC.createGain();
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);g.connect(pianoBus);
  for(const [type,det] of [['triangle',0],['square',9]]){
    const o=AC.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=det;
    const og=AC.createGain();og.gain.value=type==='square'?.18:1;o.connect(og);og.connect(g);o.start(t);o.stop(t+d+.02);
  }
}
let pianoVol=0;
function updAudio(){
  const s=G.b[1],open=s.level>0&&!s.building&&G.state==='play';
  pianoVol=open?clamp(1-Math.abs(s.x+43-G.player.x)/280,0,1):0;
  if(!AC)return;
  pianoBus.gain.setTargetAtTime(muted?0:pianoVol*.4,AC.currentTime,.2);
  const gust=.5+.5*Math.sin(G.clock*.31)*Math.sin(G.clock*.13),alive=G.b.filter(b=>b.level).length;
  windBus.gain.setTargetAtTime(muted?0:(.036-alive*.009)*(.4+gust),AC.currentTime,.3);
  if(nextNote<AC.currentTime)nextNote=AC.currentTime+.05;
  while(nextNote<AC.currentTime+.25){
    if(pianoVol>.02&&!muted){
      const i=noteIdx,st=i%8,root=48+PROG[Math.floor(i/8)%8];
      if(st===0)pnote(root-12,nextNote,.3,.5);
      if(st===4)pnote(root-5,nextNote,.3,.45);
      if(st===2||st===6){pnote(root+4,nextNote,.14,.25);pnote(root+7,nextNote,.14,.25);}
      if(hash(i*1.7)>.18)pnote(root+12+RH[i%16],nextNote,.16,.4);
    }
    noteIdx++;nextNote+=.19;
  }
}

// ---------- hints and HUD
const HINTS={
  start:'Ride out to a campfire and toss a coin to a drifter.',
  box:'An old strongbox. Ride over coins to pick them up.',
  recruit:'A drifter joins the town. Ride up to a boarded building and toss coins to fix it up.',
  funded:'Paid for. Your townsfolk will hammer until it is done.',
  noworkers:'Paid for, but there is nobody to do the work. Recruit a drifter.',
  saloon1:'The saloon is open. It pays out every morning and shelters townsfolk at night.',
  saloon2:'A second floor. The saloon pays double now.',
  store1:'The store is open and pays 4 coins every morning. Toss a coin by its tool rack to outfit a prospector.',
  miner:'A prospector. They dig at the old mine west of town by day, so ride out and collect the gold.',

  dawn:'Morning. The town paid its dues, so ride through and collect.',

  rail:'Dustfall is back on its feet. Fix up the old station for 20 coins and the railroad will come.'};
let hintTimer=0;
function hint(k,again,txt){
  if(G.seen[k]&&!again)return;G.seen[k]=1;
  const el=$('hint');el.textContent=txt||HINTS[k];el.classList.add('on');
  clearTimeout(hintTimer);hintTimer=setTimeout(()=>el.classList.remove('on'),6500);
}
let hudCoins=-1,hudDay=-1;
function hud(){
  if(hudCoins!==G.player.coins){hudCoins=G.player.coins;$('coins').textContent=hudCoins;}if(hudDay!==G.day){hudDay=G.day;$('day').textContent='Day '+hudDay;}
}

// ---------- time of day
function darkness(t){
  if(t<.06)return .5*(1-t/.06);
  if(t<.58)return 0;
  if(t<.70)return (t-.58)/.12;
  if(t<.94)return 1;
  return 1-.5*(t-.94)/.06;
}
const warmth=t=>Math.max(0,1-Math.abs(t-.61)/.09,1-Math.min(Math.abs(t-1),t)/.05);
const SKY=[[0,'#5b6494','#f2b27c'],[.08,'#6fb0d4','#f3e0b5'],[.5,'#6fb0d4','#f3e0b5'],[.6,'#5a4a86','#f6a35a'],[.66,'#3a2a5c','#e8703f'],
  [.73,'#0b0d24','#2b2350'],[.93,'#0b0d24','#2b2350'],[1.001,'#5b6494','#f2b27c']].map(k=>[k[0],rgb(k[1]),rgb(k[2])]);
function skyAt(t){
  let i=0;while(SKY[i+1][0]<=t)i++;
  const a=SKY[i],b=SKY[i+1],k=(t-a[0])/(b[0]-a[0]);
  return [mixA(a[1],b[1],k),mixA(a[2],b[2],k)];
}

// ---------- spawning
function coin(x,h,vx,vh,free){G.coins.push({x,h,vx,vh,st:'air',age:0,claimed:null,free:!!free});}
function dust(x,h,n,col,up){
  for(let i=0;i<n;i++)G.parts.push({x:x+rnd(-2,2),h:h+rnd(0,2),vx:rnd(-10,10),vh:up?rnd(8,16):rnd(4,14),life:0,max:rnd(.5,1.1),col:col||'#e2c08c',grav:up?0:-14});
}
function drifter(camp,fromEdge,x){
  const c=G.camps[camp],side=Math.random()<.5?-1:1,home=c.x+side*rnd(8,17);
  G.drifters.push({id:G.nextId++,camp,home,x:x!==undefined?x:fromEdge?(c.x<700?14:WORLD-14):home,dir:-side,walk:0,target:null,moving:false});
}
function arrivals(){G.camps.forEach((c,i)=>{if(G.folk.length+G.drifters.length<16&&G.drifters.filter(d=>d.camp===i).length<2)drifter(i,true);});}
const townie=(id,x,dir)=>G.folk.push({id,x,dir,walk:0,goal:'',tx:x,wait:0,at:false,hidden:false,moving:false,role:'folk',badge:null,ham:0,cd:0});
const puff=(x,h,col)=>G.parts.push({x,h,vx:rnd(2,7),vh:rnd(7,12),life:0,max:rnd(1.5,2.8),col,grav:0,big:1});
function recruit(d){
  G.drifters.splice(G.drifters.indexOf(d),1);townie(d.id,d.x,d.dir);
  dust(d.x,3,8);sfx.recruit();hint('recruit');
}
function spawnBandit(side){G.bandits.push({x:side<0?-10:WORLD+10,dir:-side,side,hp:2,state:'raid',loot:0,walk:0,cd:0,hurt:0,moving:true,tx:rnd(TOWN[0],TOWN[1])});}
function dawn(){
  for(const f of G.folk)if(f.role==='folk')coin(f.hidden?G.b[1].x+43:f.x,6,rnd(-22,22),rnd(50,75),true);
  for(const b of G.b){
    const d=DEF[b.type];
    if(b.level&&d.pay&&!b.robbed)for(let i=0;i<d.pay*b.level;i++)coin(b.x+d.door.x+7,5,rnd(-40,40),rnd(55,90),true);
    b.robbed=false;
  }
  arrivals();G.duskDone=false;save();
  if(G.folk.length)hint('dawn');
}
function dusk(){
  G.duskDone=true;if(G.b[1].level)arrivals();if(G.day<2)return;
  const n=Math.min(G.day-1,8),s0=Math.random()<.5?1:-1;
  for(let i=0;i<n;i++)G.raid.push({t:.74+Math.random()*.13,side:i%2?s0:-s0});
  hint('raid');sfx.sting();
}
function banner(state,h,tag,btn){
  G.state=state;$('hint').classList.remove('on');$('title').hidden=false;document.body.classList.add('title');$('cont').hidden=true;
  if(state==='over')try{localStorage.removeItem(SAVE);}catch(e){}else save();
  $('title').querySelector('h1').textContent=h;$('tag').textContent=tag;$('go').textContent=btn;$('how').textContent='';
}
const gameOver=()=>banner('over','Run out of town',`They caught you with an empty purse. You lasted ${G.day} ${G.day>1?'days':'day'}.`,'Ride again');

// ---------- save: kept in this browser; written each dawn, when something is built, and when the page is hidden
const SAVE='dustfall-save-1';
function save(){
  if(G.state!=='play'&&G.state!=='won')return;
  try{localStorage.setItem(SAVE,JSON.stringify({day:G.day,t:G.t,dusk:G.duskDone,coins:G.player.coins,px:G.player.x,nextId:G.nextId,deps:G.deps,seen:G.seen,train:!!G.train,
    b:G.b.map(b=>[b.level,b.badges,b.paid,+b.building,b.progress]),boxes:G.boxes.map(b=>b.open),
    folk:G.folk.map(f=>[f.id,f.role,Math.round(f.x),f.side,f.slot]),dr:G.drifters.map(d=>[d.id,d.camp,Math.round(d.x)])}));}catch(e){}
}
function peek(){try{return JSON.parse(localStorage.getItem(SAVE));}catch(e){return null;}}
function load(){
  const s=peek();if(!s)return false;
  reset();G.drifters.length=0;
  Object.assign(G,{day:s.day,t:s.t,duskDone:s.dusk,deps:s.deps,seen:s.seen,train:s.train?{x:STOP,v:0,chuff:0,wait:0}:null,cam:clamp(s.px-W/2,0,WORLD-W)});
  G.player.coins=s.coins;G.player.x=s.px;
  s.b.forEach((v,i)=>Object.assign(G.b[i],{level:v[0],badges:v[1],paid:v[2],building:!!v[3],progress:v[4]}));
  s.boxes.forEach((o,i)=>G.boxes[i].open=o);
  for(const [id,role,x,side,slot] of s.folk){townie(id,x,1);Object.assign(G.folk[G.folk.length-1],{role,side,slot,px:x});}
  for(const [id,camp,x] of s.dr){drifter(camp,false,x);G.drifters[G.drifters.length-1].id=id;}
  G.nextId=s.nextId;return true;
}

// ---------- update
function slotPos(b,i,n){
  const cols=Math.min(n,5),rows=Math.ceil(n/5),row=Math.floor(i/5);
  return {x:b.x+(b.w>>1)-Math.floor((cols*5-2)/2)+(i%5)*5+1,h:topOf(b,b.level)+20+(rows-1-row)*5};
}
const zoneOf=x=>G.b.find(b=>x>b.x-6&&x<b.x+b.w+12);
function tossCoin(){
  const p=G.player,b=zoneOf(p.x);
  p.coins--;p.toss=.25;sfx.toss();
  if(b&&!b.building){
    const d=DEF[b.type],cost=d.cost[b.level];
    if(cost&&b.paid+b.incoming<cost){
      const sp=slotPos(b,b.paid+b.incoming,cost);p.lock=++b.incoming+b.paid>=cost;
      G.coins.push({x:p.x,h:16,st:'slot',b,tx:sp.x,th:sp.h,age:0});return;
    }
    if(d.tool&&b.level&&b.badges+b.incoming<3){
      G.coins.push({x:p.x,h:16,st:'badge',b,tx:rackX(b)-2+(b.badges+b.incoming)*3,th:12,age:0});b.incoming++;return;
    }
  }
  coin(p.x+p.dir*7,15,p.dir*26+p.vx*.4,45,false);
}
function updPlayer(dt){
  // keys and d-pad: hold to gallop. Sticks are analog: a light push walks, a full push gallops straight away
  const p=G.player,a=input.stick||input.padAxis,dig=input.key||input.dpad,d=dig||(Math.abs(a)>.25?Math.sign(a):0);
  if(d){p.dir=d;p.hold+=dt;}else p.hold=0;
  const want=d*((dig?p.hold>.45:Math.abs(a)>.75)?(G.b[3].level?104:78):40),rate=(!d||want*p.vx<0?950:360)*dt;
  if(!d&&Math.abs(p.vx)>50)dust(p.x+Math.sign(p.vx)*9,0,2);
  p.vx+=clamp(want-p.vx,-rate,rate);p.x+=p.vx*dt;
  if(p.x<30){p.x=30;p.vx=0;}if(p.x>WORLD-30){p.x=WORLD-30;p.vx=0;}
  const sp=Math.abs(p.vx);
  p.phase+=sp*dt*.085;p.toss-=dt;
  const st=Math.floor(p.phase*4/Math.PI);
  if(st!==p.st){p.st=st;if(sp>10)sfx.hoof(sp>55?1:.6);}
  if(sp>60&&Math.random()<dt*16)dust(p.x-p.dir*8,0,1);
  p.cd-=dt;
  const drop=input.dropKey||input.dropTouch||input.padDrop;if(!drop)p.lock=false;
  if(drop&&!p.lock&&p.cd<=0){
    if(p.coins>0){tossCoin();p.cd=.22;}else if(!G.b.some(b=>b.paid)){sfx.empty();p.cd=.5;hint('broke',true);}
  }
  for(const b of G.boxes)if(!b.open&&Math.abs(b.x-p.x)<10){
    b.open=true;for(let i=0;i<4;i++)coin(b.x,4,rnd(-34,34),rnd(60,95),true);sfx.box();dust(b.x,2,6);hint('box');
  }
}
function updCoins(dt){
  const p=G.player;
  for(let i=G.coins.length-1;i>=0;i--){
    const c=G.coins[i];c.age+=dt;
    if(c.st==='air'){
      c.vh-=260*dt;c.x=clamp(c.x+c.vx*dt,8,WORLD-8);c.h+=c.vh*dt;
      if(c.h<=0){c.h=0;if(c.vh<-45){c.vh*=-.35;c.vx*=.5;sfx.clink(near(c.x));}else c.st='ground';}
    }else if(c.st==='ground'){
      if(!c.claimed&&c.age>(c.free?.5:2.2)&&Math.abs(c.x-p.x)<9){G.coins.splice(i,1);p.coins++;sfx.pick();}
    }else if(c.st==='back'){
      const dx=p.x-c.x,dh=14-c.h,dist=Math.hypot(dx,dh),step=200*dt;if(c.age<0)continue;
      if(dist>step){c.x+=dx/dist*step;c.h+=dh/dist*step;}else{G.coins.splice(i,1);p.coins++;sfx.pick();}
    }else{
      const dx=c.tx-c.x,dh=c.th-c.h,dist=Math.hypot(dx,dh),step=150*dt,b=c.b;
      if(dist>step){c.x+=dx/dist*step;c.h+=dh/dist*step;continue;}
      G.coins.splice(i,1);b.incoming--;sfx.slot();
      if(c.st==='badge'){b.badges++;continue;}
      if(++b.paid>=DEF[b.type].cost[b.level]){b.building=true;b.progress=0;hint(G.folk.some(f=>f.role==='folk')?'funded':'noworkers');}
    }
  }
}
function step(o,tx,speed,dt){
  const dx=tx-o.x;
  if(Math.abs(dx)>1){o.dir=Math.sign(dx);o.x+=o.dir*Math.min(speed*dt,Math.abs(dx));o.walk+=dt*9;o.moving=true;return false;}
  o.moving=false;return true;
}
function updDrifters(dt){
  for(const d of [...G.drifters]){
    if(!d.target){
      let best=null,bd=90;
      for(const c of G.coins)if(c.st==='ground'&&!c.claimed&&Math.abs(c.x-d.x)<bd){bd=Math.abs(c.x-d.x);best=c;}
      if(best){d.target=best;best.claimed=d;}
    }
    if(d.target&&!G.coins.includes(d.target))d.target=null;
    if(!d.target)step(d,d.home,20,dt);
    else if(step(d,d.target.x,30,dt)){G.coins.splice(G.coins.indexOf(d.target),1);recruit(d);}
  }
}
function updFolk(dt){
  const site=G.b.find(b=>b.building),sal=G.b[1],night=G.dark>.55;
  const plain=G.folk.filter(f=>f.role==='folk');
  for(const b of G.b)if(b.badges>plain.filter(f=>f.badge===b).length){
    const c=plain.filter(f=>!f.badge).sort((a,z)=>Math.abs(a.x-rackX(b))-Math.abs(z.x-rackX(b)))[0];if(c)c.badge=b;
  }
  for(const f of G.folk){
    if(f.role==='deputy'){updDeputy(f,dt);continue;}
    const miner=f.role==='miner',goal=f.badge?'badge':site&&!miner?'build'+site.x:night?(sal.level?'inside':'fire'):miner?'mine':'wander';
    if(goal!==f.goal){
      f.goal=goal;f.hidden=false;f.at=false;f.wait=0;
      f.tx=f.badge?rackX(f.badge):goal==='mine'?MINE-4+(f.id%4)*13:goal==='inside'?sal.x+43:goal==='fire'?FIRE_X+(f.id%2?1:-1)*(9+(f.id>>1)%4*6):site?site.x+8+(f.id%5)*(site.w-16)/4:rnd(TOWN[0],TOWN[1]);
    }
    if(f.hidden)continue;
    f.at=step(f,f.tx,goal==='wander'?18:28,dt);f.sit=f.work=f.dig=false;
    if(!f.at)continue;
    if(f.badge){
      const b=f.badge;b.badges--;f.badge=null;f.goal='';f.role=DEF[b.type].tool;
      if(f.role==='deputy'){f.side=G.deps%2?1:-1;f.slot=G.deps>>1;G.deps++;f.px=f.x;}
      dust(f.x,6,8,'#f2c14e',true);sfx.recruit();hint(f.role);
    }else if(goal==='mine'){
      // every 22 swings turns up a nugget, left on the ground at the mine for you (or a bandit) to collect
      f.dig=true;f.dir=f.id%2?1:-1;const before=Math.floor(f.ham);f.ham+=dt*1.6;
      if(Math.floor(f.ham)===before)continue;
      sfx.pick2(near(f.x));dust(f.x+f.dir*4,2,1,'#b59a80');
      if((f.ore=(f.ore||0)+1)>=22){f.ore=0;if(G.coins.filter(c=>c.st==='ground'&&Math.abs(c.x-MINE-20)<70).length<8)coin(f.x+f.dir*5,3,rnd(-12,12),rnd(30,50),true);}
    }else if(goal.startsWith('build')){
      f.dir=1;f.work=true;const before=Math.floor(f.ham);f.ham+=dt*2.2;
      if(Math.floor(f.ham)!==before){sfx.hammer(near(f.x));dust(f.x+3,10,1,'#d9b77a');}
    }else if(goal==='inside')f.hidden=true;
    else if(goal==='fire'){f.sit=true;f.dir=Math.sign(FIRE_X-f.x)||1;}
    else{f.wait-=dt;if(f.wait<=0){f.tx=rnd(TOWN[0],TOWN[1]);f.wait=rnd(1.5,5);}}
  }
}
function updDeputy(f,dt){
  f.cd-=dt;f.hidden=false;
  let tgt=null,bd=170;
  for(const q of G.bandits){const d=Math.abs(q.x-f.x);if(d<bd){bd=d;tgt=q;}}f.aim=!!tgt;
  if(tgt){
    f.dir=Math.sign(tgt.x-f.x)||1;
    if(bd>90)step(f,tgt.x,32,dt);
    else{
      f.moving=false;
      if(f.cd<=0){
        f.cd=1;f.flash=.08;const hit=Math.random()<.7;
        G.shots.push({x0:f.x+f.dir*8,x1:hit?tgt.x:tgt.x+f.dir*rnd(20,50),h:9,life:.09});sfx.shot(near(f.x));
        if(hit){tgt.hp--;tgt.hurt=.18;dust(tgt.x,8,3,'#d04a3a');if(tgt.hp<=0)killBandit(tgt);}
      }
    }
    return;
  }
  const guard=G.dark>.3,sher=G.b[2];
  if(step(f,guard?(f.side<0?TOWN[0]-24-f.slot*10:TOWN[1]+24+f.slot*10):f.px,26,dt)){
    if(guard)f.dir=f.side;
    else{f.wait-=dt;if(f.wait<=0){f.px=sher.x+rnd(-20,sher.w+30);f.wait=rnd(2,5);}}
  }
}
function killBandit(q){
  G.bandits.splice(G.bandits.indexOf(q),1);dust(q.x,4,10);
  for(let i=0;i<q.loot;i++)coin(q.x,6,rnd(-20,20),rnd(40,70),true);
}
function updBandits(dt){
  const p=G.player;
  for(const q of [...G.bandits]){
    q.cd-=dt;q.hurt-=dt;
    if(G.t<.5&&G.dark<.45)q.state='flee';
    if(q.state==='flee'){
      step(q,q.side<0?-40:WORLD+40,46,dt);
      if(q.x<-20||q.x>WORLD+20)G.bandits.splice(G.bandits.indexOf(q),1);
      continue;
    }
    let c=null,bd=55;
    for(const k of G.coins)if(k.st==='ground'&&!k.claimed&&Math.abs(k.x-q.x)<bd){bd=Math.abs(k.x-q.x);c=k;}
    if(c){if(step(q,c.x,40,dt)){G.coins.splice(G.coins.indexOf(c),1);q.loot++;q.state='flee';}continue;}
    const dp=p.x-q.x;
    if(Math.abs(dp)<75){
      step(q,p.x,40,dt);
      if(Math.abs(dp)<9&&q.cd<=0){
        q.cd=1.6;G.shake=.3;G.flash=.3;sfx.hit();
        if(p.coins<=0){gameOver();return;}
        const n=Math.min(3,p.coins);p.coins-=n;
        for(let i=0;i<n;i++)coin(p.x,14,rnd(-50,50),rnd(60,90),false);
        hint('hit');
      }
      continue;
    }
    let f=null;bd=60;
    for(const k of G.folk)if(k.role!=='deputy'&&!k.hidden&&Math.abs(k.x-q.x)<bd){bd=Math.abs(k.x-q.x);f=k;}
    if(f){
      if(step(q,f.x,40,dt)){
        G.folk.splice(G.folk.indexOf(f),1);drifter(f.x<700?0:1,false,f.x);
        q.loot++;q.state='flee';dust(f.x,4,6);sfx.empty();hint('mug');
      }
      continue;
    }
    const b=G.b.filter(b=>b.level&&!b.robbed&&!b.building&&DEF[b.type].pay).sort((a,z)=>Math.abs(a.x-q.x)-Math.abs(z.x-q.x))[0];
    if(b){if(step(q,b.x+DEF[b.type].door.x+7,36,dt)){b.robbed=true;q.loot+=2;q.state='flee';sfx.box();dust(q.x,6,8);hint('robbed',true);}continue;}
    if(step(q,q.tx,30,dt))q.tx=rnd(TOWN[0],TOWN[1]);
  }
}
function updBuild(dt){
  const p=G.player;
  for(const b of G.b){
    const cost=DEF[b.type].cost[b.level];
    b.short=!b.building&&b.paid>0&&!b.incoming&&(!p.coins||zoneOf(p.x)!==b)?(b.short||0)+dt:0;
    if(b.short>.45){
      for(let i=0;i<b.paid;i++){const sp=slotPos(b,i,cost);G.coins.push({x:sp.x,h:sp.h,st:'back',age:-i*.07});}
      b.paid=0;p.lock=true;hint('short',true,p.coins?`Coins returned. The ${b.type} needs all ${cost} at once.`:`Not enough coins, so they came back. The ${b.type} needs ${cost}.`);
    }
    if(!b.building)continue;
    b.progress+=dt*.035*Math.min(G.folk.filter(f=>f.work).length,5);
    if(b.progress<1)continue;
    b.building=false;b.progress=0;b.paid=0;b.level++;
    for(let i=0;i<34;i++)dust(b.x+rnd(0,b.w),rnd(0,50),1,i%3?'#f0dfb4':'#f2c14e',true);
    sfx.fanfare();hint(b.type+b.level);save();
    if(b.type==='station'){G.train={x:WORLD+70,v:-70,chuff:0,wait:0};sfx.whistle();}
    else if(G.b.slice(0,3).every(z=>z.level)&&!G.b[4].level)setTimeout(()=>hint('rail'),7000);
  }
  const s=G.b[1];
  if(s.level&&!s.building){
    if(Math.random()<dt*5)puff(s.x+s.w-14,topOf(s,s.level)+22,'#cfc6ba');
    if(pianoVol>.05&&Math.random()<dt*1.6)G.parts.push({x:s.x+43+rnd(-6,6),h:18,vx:rnd(-5,5),vh:rnd(9,14),life:0,max:1.8,col:'#f0dfb4',grav:0,lit:1,note:1});
  }
}
function updHens(dt){
  const p=G.player;if(!G.b[0].level||G.dark>.7)return;
  for(const c of G.hens){
    if(c.run<=0&&Math.abs(p.x-c.x)<16&&Math.abs(p.vx)>30){
      c.run=1;c.dir=Math.sign(c.x-p.x)||1;sfx.cluck(near(c.x));
      for(let i=0;i<3;i++)G.parts.push({x:c.x,h:4,vx:rnd(-12,12),vh:rnd(6,16),life:0,max:.8,col:'#f4ecd6',grav:-20});
    }
    c.run-=dt;c.t-=dt;c.hop=c.run>0?Math.abs(Math.sin(c.run*14))*4:0;
    if(c.run>0)c.x+=c.dir*55*dt;
    else{if(c.t<=0){c.t=rnd(1,4);c.mode=Math.random()<.5?'peck':'walk';c.dir=Math.random()<.5?-1:1;}if(c.mode==='walk')c.x+=c.dir*7*dt;}
    c.x=clamp(c.x,484,770);
  }
}
// the railroad: the train rolls in once the station is up, lets a few settlers off, and that wins the game
function updTrain(dt){
  const tr=G.train;if(!tr)return;
  if(!tr.v){
    if(Math.random()<dt*1.2)puff(tr.x+10,25,'#cfc6ba');
    if(tr.wait>0&&(tr.wait-=dt)<=0)banner('won','End of the line',`The railroad reached Dustfall on day ${G.day}. The town is on the map.`,'Keep riding');
    return;
  }
  tr.v=-clamp((tr.x-STOP)*1.1,10,70);tr.x+=tr.v*dt;
  if((tr.chuff-=dt*Math.abs(tr.v)/14)<=0){tr.chuff=1;burst(.09,.16*near(tr.x));puff(tr.x+10,25,'#cfc6ba');}
  if(tr.x-STOP>.6)return;
  tr.x=STOP;tr.v=0;tr.wait=3.5;sfx.whistle();
  for(let i=0;i<16;i++)dust(tr.x+rnd(4,44),rnd(0,6),1,'#e8e4dc',true);
  for(let i=0;i<3;i++)townie(G.nextId++,tr.x+72+i*10,-1);
}
function updWorld(dt){
  for(const w of G.weeds){
    w.vh-=160*dt;w.h+=w.vh*dt;if(w.h<=0){w.h=0;w.vh=rnd(20,48);}w.x+=w.vx*dt;if(w.x<-20)w.x=WORLD+20;if(w.x>WORLD+20)w.x=-20;
  }
  for(let i=G.parts.length-1;i>=0;i--){
    const q=G.parts[i];q.life+=dt;q.x+=q.vx*dt;q.h+=q.vh*dt;q.vh+=q.grav*dt;
    if(q.life>q.max||q.h<0)G.parts.splice(i,1);
  }
  for(const x of [FIRE_X,G.camps[0].x,G.camps[1].x]){
    if(Math.random()<dt*2.5)G.parts.push({x:x+rnd(-1,1),h:6,vx:rnd(-4,4),vh:rnd(10,20),life:0,max:rnd(.6,1.3),col:Math.random()<.5?'#ffb13b':'#ff7a2a',grav:0,lit:1});

  R(sx-(w>>1),y-3,w,3,'#f2c14e');P(sx-(w>>1),y-3,'#ffe58a');if(w===3)P(sx+1,y-1,'#c08a1e');
}
function drawFore(cam){
  const c=css(mixA([62,38,22],[9,8,20],G.dark));
  for(let i=0;i<34;i++){
    const x=Math.round(i*66+hash(i+200)*40-cam*1.5)-20,k=hash(i+210);
    if(x<-34||x>W+10)continue;
    if(k<.45)for(let j=0;j<7;j++){const bh=4+Math.floor(hash(i*7+j)*8);line(x+j*2,H,x+j*2+Math.sin(G.clock*1.5+i+j)*.7+(j-3)*.5,H-bh,c);}
    else if(k<.65){R(x,H-5,15,5,c);R(x+2,H-8,10,3,c);R(x+4,H-9,5,1,c);}
    else if(k<.82){R(x+3,H-16,3,16,c);R(x,H-10,3,2,c);R(x,H-13,2,4,c);R(x+6,H-8,3,2,c);R(x+7,H-12,2,5,c);}
    else{R(x,H-13,2,13,c);R(x+24,H-11,2,11,c);line(x,H-9,x+24,H-8,c);line(x,H-5,x+24,H-4,c);}
  }
}

// ---------- frame
function draw(){
  const cam=Math.round(G.cam+(G.shake>0?rnd(-2,2)*G.shake*4:0)),dark=G.dark,[st,sb]=skyAt(G.t),p=G.player;
  ctx.clearRect(0,0,W,H);
  drawFar(cam,sb);drawMid(cam,sb);drawBirds(cam);
  drawPoles(cam);drawMine(MINE-cam);drawWindmill(474-cam);drawTower(606-cam);
  for(const b of G.b){
    const sx=b.x-cam;if(sx>W+20||sx+b.w<-20)continue;
    shadow(sx+b.w/2,b.w+14);facade(sx,b,b.level);
    if(b.building){
      const nh=topOf(b,b.level+1)+26,y=GY-Math.round(nh*b.progress),c='#d9b77a';
      ctx.save();ctx.beginPath();ctx.rect(sx-20,y,b.w+50,nh);ctx.clip();facade(sx,b,b.level+1);ctx.restore();
      R(sx-8,GY-nh+12,1,nh-12,c);R(sx+b.w+7,GY-nh+12,1,nh-12,c);R(sx-8,y-1,b.w+16,1,c);R(sx-8,y,b.w+16,1,'#a8854f');
      line(sx-8,GY,sx-2,y,c);for(let k=GY-3;k>y;k-=4)P(sx-6+(GY-k)*6/(GY-y+1),k,c);
    }
  }
  drawGround(cam);drawRail(cam);
  G.camps.forEach(c=>{drawCamp(c.x-cam);drawFireBase(c.x-cam,1);});
  drawFireBase(FIRE_X-cam);
  for(const [x,type,v] of PROPS)if(x-cam>-40&&x-cam<W+10)drawProp(x-cam,type,v);
  for(const b of G.boxes)drawBox(b.x-cam,b.open);
  for(const w of G.weeds){
    const x=Math.round(w.x-cam),y=GY-7-Math.round(w.h),f=Math.floor(w.x/4)&3;
    shadow(x+3,6);R(x+1,y,5,7,'#a8854f');R(x,y+1,7,5,'#a8854f');R(x+2,y+1,3,1,'#c7a56b');
    P(x+1+f,y+2,'#6f5433');P(x+5-f,y+4,'#6f5433');P(x+3,y+1+f,'#6f5433');P(x+2,y+5-(f>>1),'#6f5433');P(x+4,y+3,'#8a6a40');
  }
  for(const q of G.parts){
    if(q.lit)continue;
    const k=q.life/q.max,x=q.x-cam,y=GY-1-q.h;
    if(q.streak){ctx.globalAlpha=.35*Math.sin(k*Math.PI);R(x,y,4,1,q.col);}
    else if(q.big){ctx.globalAlpha=.6*(1-k);R(x,y,2+k*2,2+k*2,q.col);}
    else{ctx.globalAlpha=1-k*k;P(x,y,q.col);}
  }
  ctx.globalAlpha=1;
  // golden hour, then night in two coats so people stay readable against the dark town
  const coat=(col,a)=>{if(a<=0)return;ctx.globalCompositeOperation='source-atop';ctx.fillStyle=`rgba(${col},${a})`;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';};
  coat('255,120,50',.2*warmth(G.t));coat('16,14,54',.65*dark);
  // lit windows go on first so nobody walks behind the glass; people get their own layer and a lighter coat of night
  const la=clamp(dark*1.4,0,1),main=ctx;
  for(const b of G.b)lights(b.x-cam,b,b.building?0:la);
  if(G.folk.some(f=>f.role==='miner')){R(MINE+12-cam,GY-13,2,3,'#ffe08a');glow(MINE+13-cam,GY-12,16,'255,200,110',.1+.4*la);}
  if(G.train){const sx=Math.round(G.train.x-cam);glow(sx+1,GY-19,22,'255,230,150',.12+.5*la);ctx.globalAlpha=la;for(let i=0;i<6;i++)R(sx+68+i*7,GY-16,4,5,'#ffcf6b');ctx.globalAlpha=1;}
  ctx=pctx;ctx.clearRect(0,0,W,H);
  if(G.b[0].level&&dark<.7)G.hens.forEach((c,i)=>{
    const x=Math.round(c.x-cam),y=GY-Math.round(c.hop),d=c.dir,hx=d>0?x+2:x-3,peck=c.run<=0&&c.mode==='peck'&&Math.sin(G.clock*9+i)>0,col=i===1?'#b0703c':'#f4ecd6';
    R(x-2,y-4,4,3,col);P(d>0?x-3:x+2,y-5,col);P(x-1,y-1,'#d98a2e');P(x+1,y-1,'#d98a2e');
    if(peck){P(hx,y-3,col);P(hx+d,y-2,'#d98a2e');}else{R(hx,y-6,1,2,col);P(hx,y-7,'#c0392b');P(hx+d,y-5,'#d98a2e');}
  });
  for(const d of G.drifters)person(Math.round(d.x-cam),d,'drifter');
  for(const f of G.folk)if(!f.hidden)person(Math.round(f.x-cam),f,f.role);
  for(const q of G.bandits)person(Math.round(q.x-cam),q,'bandit');
  if(G.state==='play')drawHorse(p.x-cam,p);
  coat('16,14,54',.3*dark);ctx=main;ctx.drawImage(ppl,0,0);
  drawFire(FIRE_X-cam,0);drawFire(G.camps[0].x-cam,2);drawFire(G.camps[1].x-cam,4);
  for(const q of G.parts){
    if(!q.lit)continue;
    const x=Math.round(q.x-cam+(q.note?Math.sin(q.life*5)*2:0)),y=Math.round(GY-1-q.h);ctx.globalAlpha=1-(q.life/q.max)**2;
    if(q.note){R(x+1,y,1,4,q.col);R(x,y+3,2,2,q.col);P(x+2,y+1,q.col);}else P(x,y,q.col);
  }
  ctx.globalAlpha=1;
  for(const s of G.shots){line(s.x0-cam,GY-s.h,s.x1-cam,GY-s.h,'#fff3c4');}
  for(const c of G.coins)drawCoin(Math.round(c.x-cam),GY-Math.round(c.h),c);
  if(G.state==='play')for(const b of G.b){
    const cost=DEF[b.type].cost[b.level];
    if(!cost||b.building||!(b.paid+b.incoming>0||zoneOf(p.x)===b))continue;
    for(let i=0;i<cost;i++){const q=slotPos(b,i,cost),x=Math.round(q.x-cam),y=GY-q.h;
      R(x-2,y-4,5,5,'#24160f');R(x-1,y-3,3,3,i<b.paid?'#f2c14e':'#6b5a3a');if(i<b.paid)P(x-1,y-3,'#ffe58a');}
  }
  if(Math.sin(G.clock*9)>0)for(const side of [-1,1])if(G.bandits.some(q=>side<0?q.x-cam<4:q.x-cam>W-4)){
    const x=side<0?2:W-3,y=GY-9;for(let k=0;k<4;k++)R(x-side*k,y-k,1,k*2+1,'#ff5a3c');
  }
  drawFore(cam);
  const vg=ctx.createRadialGradient(W/2,H*.45,H*.45,W/2,H*.45,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(20,10,6,0)');vg.addColorStop(1,'rgba(20,10,6,.42)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(G.flash>0)R(0,0,W,H,`rgba(200,40,30,${G.flash*.8})`);
  // sky goes in behind everything: clouds, sun or moon, stars, then the gradient
  ctx.globalCompositeOperation='destination-over';
  const cc=css(mixA(mixA([255,250,240],sb,.4),[46,44,80],dark*.85)),cs=css(mixA(mixA([225,205,195],sb,.6),[34,32,64],dark*.85));
  for(let i=0;i<6;i++){
    const w=26+Math.floor(hash(i+400)*30),span=W+140,x=Math.round(((hash(i+410)*span+G.clock*(1.2+hash(i+420)*1.6)-cam*.04)%span+span)%span)-80,y=Math.round(GY*(.1+hash(i+430)*.42));
    R(x+3,y+3,w-7,1,cs);R(x,y,w,3,cc);R(x+4,y-2,Math.round(w*.5),2,cc);R(x+Math.round(w*.3),y-4,Math.round(w*.32),2,cc);R(x+Math.round(w*.55),y-1,Math.round(w*.3),1,cc);
  }
  const disc=(x,y,r,c,a)=>{ctx.globalAlpha=a;ctx.fillStyle=c;ctx.beginPath();ctx.arc(Math.round(x),Math.round(y),r,0,7);ctx.fill();ctx.globalAlpha=1;};
  if(G.t<.68){
    const k=G.t/.66,x=W*(.1+.8*k),y=GY-4-Math.sin(k*Math.PI)*(GY*.82),low=Math.pow(1-Math.sin(clamp(k,0,1)*Math.PI),2);
    disc(x,y,7+low*2,css(mixA([255,243,196],[255,150,70],low)),1);disc(x,y,13+low*4,'#ffd98a',.25);disc(x,y,22+low*8,'#ffc070',.12);
  }else{
    const k=(G.t-.68)/.32,x=W*(.12+.76*k),y=GY-8-Math.sin(k*Math.PI)*(GY*.7);
    P(x-2,y-1,'#bfc6d8');P(x+1,y+2,'#bfc6d8');R(x,y-3,2,1,'#c9cfdf');disc(x,y,5,'#e8ecf5',1);disc(x,y,11,'#aab4e0',.15);
  }
  const sa=clamp((dark-.35)/.5,0,1);
  if(sa>0)for(let i=0;i<70;i++){
    const x=Math.floor(hash(i+70)*W),y=Math.floor(hash(i+90)*(GY-20));ctx.globalAlpha=sa*(.45+.55*Math.sin(G.clock*(1+hash(i)*2)+i*1.7)**2);
    P(x,y,i%7?'#fff':'#ffe9b0');if(i%11===0){P(x-1,y,'#cfd6ff');P(x+1,y,'#cfd6ff');P(x,y-1,'#cfd6ff');P(x,y+1,'#cfd6ff');}
  }
  ctx.globalAlpha=1;
  const N=26;
  for(let i=0;i<N;i++){const y0=Math.floor(i*GY/N);R(0,y0,W,i===N-1?H-y0:Math.ceil(GY/N)+1,css(mixA(st,sb,Math.pow(i/(N-1),1.3))));}
  ctx.globalCompositeOperation='source-over';
}

// ---------- canvas sizing: whole-number pixel scale; portrait gets a tall sky and leaves room below for the controls
function resize(){
  const dpr=window.devicePixelRatio||1,sw=stage.clientWidth,sh=stage.clientHeight,tall=sw/sh<1.25;
  const ch=tall?Math.min(sh,clamp(sh-210,sw/1.25,sw*1.5)):sh;
  const sc=tall?Math.max(1,Math.round(sw*dpr/200)):Math.max(1,Math.round(ch*dpr/170),Math.ceil(sw*dpr/480));
  W=Math.ceil(sw*dpr/sc);H=Math.ceil(ch*dpr/sc);GY=H-clamp(Math.round(H*.26),30,48);
  cv.width=ppl.width=W;cv.height=ppl.height=H;cv.style.width=W*sc/dpr+'px';cv.style.height=H*sc/dpr+'px';
  ctx.imageSmoothingEnabled=false;
}
reset();addEventListener('resize',resize);resize();

// ---------- input
const KEYS={ArrowLeft:-1,a:-1,A:-1,ArrowRight:1,d:1,D:1};
const held=new Set();
addEventListener('keydown',e=>{
  if(G.state!=='play'){if(e.key==='Enter'||e.key===' '){e.preventDefault();start();}return;}
  if(KEYS[e.key]){held.add(e.key);input.key=KEYS[e.key];e.preventDefault();}
  if(e.key===' '||e.key==='ArrowDown'||e.key==='s'||e.key==='S'){input.dropKey=true;e.preventDefault();}
});
addEventListener('keyup',e=>{
  if(KEYS[e.key]){held.delete(e.key);const last=[...held].pop();input.key=last?KEYS[last]:0;}
  if(e.key===' '||e.key==='ArrowDown'||e.key==='s'||e.key==='S')input.dropKey=false;
});
addEventListener('blur',()=>{held.clear();input.key=0;input.dropKey=false;});
const pad=$('pad'),knob=$('knob'),toss=$('toss');let padId=null;
const padSet=e=>{const r=pad.getBoundingClientRect(),dx=clamp(e.clientX-r.left-r.width/2,-34,34);input.stick=dx/34;knob.style.transform=`translateX(${dx}px)`;};
pad.addEventListener('pointerdown',e=>{padId=e.pointerId;try{pad.setPointerCapture(padId);}catch(_){}padSet(e);e.preventDefault();});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)padSet(e);});
for(const ev of ['pointerup','pointercancel'])pad.addEventListener(ev,e=>{if(e.pointerId===padId){padId=null;input.stick=0;knob.style.transform='';}});
toss.addEventListener('pointerdown',e=>{input.dropTouch=true;toss.classList.add('on');e.preventDefault();});
for(const ev of ['pointerup','pointercancel','pointerleave'])toss.addEventListener(ev,()=>{input.dropTouch=false;toss.classList.remove('on');});addEventListener('contextmenu',e=>e.preventDefault());
const touchy=()=>{document.body.classList.add('touch');if(G.state==='title')$('how').textContent='Push the stick to ride, further to gallop. Tap the coin to toss one.';};
if((window.matchMedia&&matchMedia('(pointer:coarse)').matches)||navigator.maxTouchPoints>0)touchy();
addEventListener('touchstart',touchy,{once:true,passive:true});
// stop long-press text selection, the copy bubble, and double-tap or pinch zoom; real buttons still get their taps
const quiet=e=>{const t=e.target.closest?e.target:e.target.parentElement;if(!t||!t.closest('#go,#cont,#mute'))e.preventDefault();};
for(const ev of ['touchstart','touchmove','touchend','gesturestart','selectstart','dblclick'])document.addEventListener(ev,quiet,{passive:false});
// physical controller: left stick or d-pad rides, A / B / X or right trigger tosses, A or Start begins
let padWas=false;
function pollPad(){
  const gp=navigator.getGamepads?[...navigator.getGamepads()].find(g=>g&&g.connected):null,on=i=>!!(gp&&gp.buttons[i]&&gp.buttons[i].pressed);
  input.padAxis=gp&&Math.abs(gp.axes[0])>.25?gp.axes[0]:0;input.dpad=on(15)-on(14);input.padDrop=[0,1,2,7].some(on);
  const go=on(0)||on(9);if(go&&!padWas&&G.state!=='play')start();padWas=go;
}
addEventListener('gamepadconnected',()=>{if(G.state==='title')$('how').textContent='Controller: stick or d-pad to ride, A to toss a coin.';});
$('mute').addEventListener('click',()=>{muted=!muted;$('mute').textContent=muted?'Sound off':'Sound on';$('mute').blur();});

// ---------- start and loop
function start(keep){
  if(G.state==='play')return;if(G.state==='over')reset();
  initAudio();if(AC&&AC.state==='suspended')AC.resume();
  if(G.state!=='won'&&keep!==true){G.t=.08;hint('start');}
  G.state='play';G.player.lock=true;input.key=input.stick=0;input.dropKey=input.dropTouch=false;held.clear();
  $('title').hidden=true;document.body.classList.remove('title');
}
$('go').addEventListener('click',start);
$('cont').addEventListener('click',()=>{if(load())start(true);});
if(peek()){$('cont').hidden=false;$('cont').textContent='Continue, day '+peek().day;}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});addEventListener('pagehide',save);
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  pollPad();for(let i=0;i<G.timeScale;i++)update(dt);
  draw();hud();updAudio();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
